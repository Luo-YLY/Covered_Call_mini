<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ETF备兑组合研究看板</title>
  <script src="../../outputs/ver3_0_dashboard_data/ver3_dashboard_data.js"></script>
  <style>
    :root {
      --bg: #f5f7fa;
      --panel: #ffffff;
      --ink: #18212f;
      --muted: #627083;
      --line: #dbe3ec;
      --nav: #1d2935;
      --nav-soft: #2d3b49;
      --blue: #2f6fbd;
      --green: #247a5a;
      --red: #bd4b43;
      --amber: #9b6a18;
      --teal: #23858b;
      --shadow: 0 1px 7px rgba(17, 31, 48, 0.08);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Microsoft YaHei", "Segoe UI", Arial, sans-serif;
      color: var(--ink);
      background: var(--bg);
      font-size: 13px;
    }
    .app {
      display: grid;
      grid-template-columns: 270px minmax(0, 1fr);
      min-height: 100vh;
    }
    aside {
      background: var(--nav);
      color: #f3f7fb;
      padding: 16px;
      position: sticky;
      top: 0;
      height: 100vh;
      overflow: auto;
    }
    main { padding: 18px; min-width: 0; }
    h1, h2, h3, p { margin-top: 0; }
    h1 { font-size: 20px; margin-bottom: 4px; }
    h2 { font-size: 15px; margin-bottom: 10px; }
    h3 { font-size: 14px; margin-bottom: 8px; }
    p { color: var(--muted); line-height: 1.5; }
    aside p { color: #c8d4df; }
    .brand {
      border-bottom: 1px solid #41505f;
      padding-bottom: 14px;
      margin-bottom: 14px;
    }
    .brand .title {
      font-size: 17px;
      font-weight: 800;
      line-height: 1.25;
    }
    .brand .subtitle {
      color: #c8d4df;
      font-size: 12px;
      margin-top: 6px;
      line-height: 1.5;
    }
    label {
      display: block;
      color: #d8e2eb;
      font-size: 12px;
      margin: 14px 0 6px;
    }
    select {
      width: 100%;
      height: 34px;
      border: 1px solid #455666;
      border-radius: 6px;
      background: #121b24;
      color: #ffffff;
      padding: 0 10px;
      font: inherit;
    }
    .nav-tabs {
      display: grid;
      gap: 7px;
      margin-top: 16px;
    }
    .nav-tabs button,
    .seg button {
      border: 1px solid transparent;
      border-radius: 6px;
      font: inherit;
      cursor: pointer;
    }
    .nav-tabs button {
      height: 34px;
      text-align: left;
      padding: 0 10px;
      background: var(--nav-soft);
      color: #ecf3f9;
    }
    .nav-tabs button.active {
      background: #e9f3f4;
      color: #10393f;
      border-color: #b7d6d8;
      font-weight: 700;
    }
    .side-note {
      margin-top: 16px;
      padding-top: 12px;
      border-top: 1px solid #41505f;
      color: #c8d4df;
      font-size: 12px;
      line-height: 1.55;
    }
    .universe-note {
      margin-top: 12px;
      padding-top: 10px;
      border-top: 1px solid #41505f;
    }
    .universe-note strong {
      color: #ffffff;
      font-weight: 800;
    }
    .topbar {
      display: flex;
      justify-content: space-between;
      gap: 14px;
      align-items: flex-start;
      margin-bottom: 14px;
    }
    .status {
      display: flex;
      gap: 7px;
      flex-wrap: wrap;
      justify-content: flex-end;
      color: var(--muted);
      font-size: 12px;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      min-height: 24px;
      padding: 3px 7px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #fff;
      color: #3b4b5d;
      white-space: nowrap;
    }
    .badge.pass {
      border-color: #b7d7c8;
      background: #edf8f2;
      color: #1f684d;
      font-weight: 700;
    }
    .badge.fail {
      border-color: #e2b7b2;
      background: #fff2f0;
      color: #9a3932;
      font-weight: 700;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(12, minmax(0, 1fr));
      gap: 12px;
      margin-bottom: 12px;
    }
    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: var(--shadow);
      padding: 12px;
      min-width: 0;
    }
    .span-2 { grid-column: span 2; }
    .span-3 { grid-column: span 3; }
    .span-4 { grid-column: span 4; }
    .span-5 { grid-column: span 5; }
    .span-6 { grid-column: span 6; }
    .span-7 { grid-column: span 7; }
    .span-8 { grid-column: span 8; }
    .span-12 { grid-column: span 12; }
    .metric {
      font-size: 21px;
      font-weight: 800;
      margin-top: 3px;
      line-height: 1.2;
    }
    .metric small {
      display: block;
      font-size: 12px;
      color: var(--muted);
      font-weight: 500;
      margin-top: 5px;
    }
    .metric.positive { color: var(--green); }
    .metric.warning { color: var(--amber); }
    .metric.risk { color: var(--red); }
    .toolbar {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      align-items: center;
      margin-bottom: 10px;
      flex-wrap: wrap;
    }
    .seg {
      display: inline-flex;
      gap: 6px;
      flex-wrap: nowrap;
      max-width: 100%;
      overflow-x: auto;
      padding: 1px 0 6px;
      scrollbar-width: thin;
    }
    .seg button {
      flex: 0 0 auto;
      height: 32px;
      padding: 0 12px;
      background: #eef3f7;
      color: #2d3d4d;
      border-color: #d6e0e9;
      font-weight: 700;
    }
    .seg button.active {
      background: #dcefee;
      color: #143f43;
      border-color: #afd4d2;
      font-weight: 700;
    }
    .chart {
      width: 100%;
      height: 268px;
      overflow: hidden;
    }
    .chart.with-legend {
      display: grid;
      grid-template-rows: minmax(0, 1fr) auto;
      gap: 6px;
    }
    .chart.short { height: 205px; }
    .chart.tall { height: 318px; }
    .chart.depth { height: 318px; }
    .chart-figure {
      width: 100%;
      height: 318px;
      object-fit: contain;
      display: block;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 8px;
    }
    .zoomable-image {
      cursor: zoom-in;
    }
    .zoomable-image:focus-visible {
      outline: 2px solid var(--blue);
      outline-offset: 3px;
    }
    .surface-chart {
      width: 100%;
      height: 338px;
      position: relative;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #ffffff;
      overflow: hidden;
      touch-action: none;
    }
    .surface-chart canvas {
      width: 100%;
      height: 100%;
      display: block;
      cursor: grab;
    }
    .surface-chart canvas.dragging { cursor: grabbing; }
    .surface-tooltip {
      position: absolute;
      pointer-events: none;
      max-width: 245px;
      padding: 7px 8px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.96);
      box-shadow: var(--shadow);
      color: var(--ink);
      font-size: 11px;
      line-height: 1.45;
      display: none;
      z-index: 2;
    }
    svg { width: 100%; height: 100%; display: block; }
    .axis { stroke: #cfd8e3; stroke-width: 1; }
    .gridline { stroke: #e6edf3; stroke-width: 1; }
    .line { fill: none; stroke-width: 2.2; }
    .bar { opacity: .9; }
    .legend {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      color: var(--muted);
      font-size: 12px;
      margin-top: 0;
      min-height: 18px;
      align-items: center;
    }
    .legend span {
      display: inline-flex;
      align-items: center;
      white-space: nowrap;
    }
    .legend span.active {
      color: var(--ink);
      font-weight: 800;
    }
    .legend span.dim {
      opacity: 0.55;
    }
    .dot {
      display: inline-block;
      width: 9px;
      height: 9px;
      border-radius: 50%;
      margin-right: 5px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12px;
    }
    th, td {
      border-bottom: 1px solid var(--line);
      padding: 6px 6px;
      text-align: right;
      white-space: nowrap;
    }
    th:first-child, td:first-child { text-align: left; }
    th {
      color: var(--muted);
      font-weight: 700;
      background: #fafbfd;
      position: sticky;
      top: 0;
      z-index: 1;
    }
    th.sortable { padding: 0; }
    .sort-button {
      width: 100%;
      border: 0;
      background: transparent;
      color: inherit;
      font: inherit;
      font-weight: 700;
      padding: 6px;
      cursor: pointer;
      display: inline-flex;
      justify-content: flex-end;
      align-items: center;
      gap: 4px;
      white-space: nowrap;
    }
    th:first-child .sort-button { justify-content: flex-start; }
    .sort-button.active { color: var(--blue); }
    .sort-icon {
      display: inline-block;
      min-width: 10px;
      font-size: 10px;
      color: #7c8da0;
    }
    .sort-button.active .sort-icon { color: var(--blue); }
    td.long-text {
      min-width: 190px;
      max-width: 320px;
      white-space: normal;
      line-height: 1.4;
    }
    .table-wrap {
      overflow: auto;
      max-height: 390px;
      border: 1px solid var(--line);
      border-radius: 8px;
    }
    .callout {
      border-left: 4px solid var(--teal);
      background: #eef8f8;
      padding: 10px 11px;
      border-radius: 6px;
      color: #24444a;
      line-height: 1.55;
    }
    .definition-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }
    .definition {
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 10px;
      background: #fbfcfd;
    }
    .definition b {
      display: block;
      margin-bottom: 5px;
      color: var(--ink);
    }
    .definition span {
      color: var(--muted);
      line-height: 1.5;
    }
    .compare-control {
      margin-top: 12px;
      padding-top: 10px;
      border-top: 1px solid #41505f;
    }
    .compare-title {
      color: #ffffff;
      font-size: 12px;
      font-weight: 800;
      margin-bottom: 8px;
    }
    .compare-group {
      color: #aebdcc;
      font-size: 11px;
      margin: 9px 0 5px;
    }
    .compare-option {
      display: flex;
      align-items: flex-start;
      gap: 7px;
      padding: 4px 0;
      color: #dce6ee;
      font-size: 12px;
      line-height: 1.35;
      cursor: pointer;
    }
    .compare-option input {
      flex: 0 0 auto;
      margin-top: 2px;
      accent-color: #8fd6d1;
    }
    .compare-option span {
      min-width: 0;
    }
    .empty {
      color: var(--muted);
      padding: 26px 0;
      text-align: center;
    }
    .figure-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }
    .figure-grid img {
      width: 100%;
      display: block;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
    }
    .figure-caption {
      color: var(--muted);
      font-size: 12px;
      margin-top: 6px;
    }
    .image-modal {
      position: fixed;
      inset: 0;
      z-index: 1000;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr) auto;
      gap: 10px;
      padding: 18px;
      background: rgba(13, 21, 31, 0.78);
    }
    .image-modal[hidden] {
      display: none;
    }
    .image-modal-close {
      justify-self: end;
      width: 34px;
      height: 34px;
      border: 1px solid rgba(255, 255, 255, 0.35);
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.95);
      color: var(--ink);
      font-size: 22px;
      line-height: 1;
      cursor: pointer;
    }
    .image-modal img {
      align-self: center;
      justify-self: center;
      max-width: min(96vw, 1400px);
      max-height: 82vh;
      object-fit: contain;
      background: #ffffff;
      border-radius: 8px;
      box-shadow: 0 14px 36px rgba(0, 0, 0, 0.26);
    }
    .image-modal-caption {
      justify-self: center;
      max-width: min(96vw, 1400px);
      color: #ffffff;
      font-size: 13px;
      line-height: 1.45;
      text-align: center;
    }
    body.modal-open {
      overflow: hidden;
    }
    .chart-note {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.45;
      margin-top: 6px;
    }
    .formula-box {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fbfcfd;
      padding: 10px;
    }
    .formula-box b {
      display: block;
      color: var(--ink);
      margin-bottom: 6px;
    }
    .formula-main {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      margin: 6px 0 10px;
      padding: 8px 10px;
      border-radius: 6px;
      background: #f2f5f8;
      color: #243142;
      font-family: "Cambria Math", "Times New Roman", "Microsoft YaHei", serif;
      font-size: 14px;
    }
    .formula-main .score-name {
      font-weight: 800;
      color: var(--ink);
    }
    .frac {
      display: inline-grid;
      grid-template-rows: auto auto;
      align-items: center;
      justify-items: center;
      line-height: 1.1;
      vertical-align: middle;
    }
    .frac .top {
      border-bottom: 1px solid currentColor;
      padding: 0 4px 2px;
    }
    .frac .bottom {
      padding-top: 2px;
    }
    .formula-list {
      display: grid;
      gap: 5px;
      margin: 8px 0;
    }
    .formula-row {
      display: grid;
      grid-template-columns: 72px minmax(0, 1fr);
      gap: 7px;
      align-items: start;
    }
    .formula-row .term {
      color: var(--ink);
      font-weight: 800;
      font-family: "Cambria Math", "Times New Roman", serif;
    }
    .formula-row .expr {
      color: #445369;
      line-height: 1.45;
    }
    @media (max-width: 980px) {
      .app { grid-template-columns: 1fr; }
      aside {
        position: static;
        height: auto;
      }
      .span-2, .span-3, .span-4, .span-5, .span-6, .span-7, .span-8, .span-12 {
        grid-column: span 12;
      }
      .topbar { flex-direction: column; }
      .status { justify-content: flex-start; }
      .definition-grid { grid-template-columns: 1fr; }
      .figure-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="app">
    <aside>
      <div class="brand">
        <div class="title">ETF备兑组合研究</div>
        <div class="subtitle">候选组合、风险收益与稳健性证据</div>
      </div>

      <label for="candidateSelect">候选组合</label>
      <select id="candidateSelect"></select>

      <nav class="nav-tabs" aria-label="dashboard sections">
        <button class="active" data-tab="overview">总览</button>
        <button data-tab="sleeves">单券策略腿</button>
        <button data-tab="fixed">固定权重</button>
        <button data-tab="frontier">回撤前沿</button>
        <button data-tab="robustness">稳健性</button>
        <button data-tab="figures">图表原件</button>
      </nav>

      <div class="side-note">
        <div>主样本：<span id="sampleText"></span></div>
        <div>数据生成：<span id="generatedText"></span></div>
        <div>主候选：<span id="primaryText"></span></div>
        <div class="universe-note">
          <div><strong>A组</strong>：510300 + 510500 + 159915</div>
          <div><strong>B组</strong>：510300 + 510050 + 159915</div>
        </div>
      </div>

      <div id="overviewCompareControls" class="compare-control" hidden></div>
    </aside>

    <main>
      <div class="topbar">
        <div>
          <h1 id="pageTitle">当前组合研究总览</h1>
          <p id="pageLead">当前看板以目标 Delta × 覆盖比例、回撤预算组合和稳健性研究为核心展示口径。</p>
        </div>
        <div class="status">
          <span class="badge">静态数据包</span>
          <span class="badge">不重跑回测</span>
          <span class="badge">中文报告口径</span>
        </div>
      </div>

      <section id="kpis" class="grid"></section>
      <section id="content"></section>
    </main>
  </div>

  <div id="imageModal" class="image-modal" hidden aria-hidden="true">
    <button type="button" class="image-modal-close" data-modal-close aria-label="Close image preview">&times;</button>
    <img id="imageModalImg" alt="" />
    <div id="imageModalCaption" class="image-modal-caption"></div>
  </div>

  <script>
    const DATA = window.VER3_DASHBOARD_DATA || {};
    const state = {
      tab: "overview",
      candidate: DATA.primary_candidate || "B_v31_D20_51030070_51005014_15991516",
      robustnessCandidate: (DATA.stepC?.stability_scorecard || []).some(row => row.portfolio_name === "B_default_D20") ? "B_default_D20" : ((DATA.stepC?.recommendations || [])[0]?.portfolio_name || (DATA.stepC?.stability_scorecard || [])[0]?.portfolio_name || "B_default_D20"),
      constraint: "default",
      sleeveEtf: "ALL",
      surfaceEtf: (DATA.stepA?.target_delta_surface_metadata || DATA.stepA?.moneyness_refined_surface_metadata || DATA.stepA?.parameter_surface_metadata || [])[0]?.etf_code || "510300",
      surfaceMetric: "sharpe_daily_mean",
      surfaceYaw: -0.72,
      surfacePitch: 0.72,
      surfaceGridSort: { key: null, direction: null },
      candidateComparisonKeys: new Set(),
      comparisonKeys: new Set((DATA.overviewComparisons?.options || []).filter(row => row.default_selected).map(row => row.key))
    };

    const palette = ["#2f6fbd", "#247a5a", "#bd4b43", "#9b6a18", "#23858b", "#6f5ca8", "#536476", "#b75d69", "#4f8f40", "#8b6bb6", "#7b8794", "#cf7d28"];
    const candidateNames = {
      B_v31_D18_51030070_51005021_15991509: "B组 回撤预算18%",
      B_v31_D20_51030070_51005014_15991516: "B组 回撤预算20% 主线",
      B_v31_D22_51030070_51005007_15991523: "B组 回撤预算22%",
      B_v31_D25_51030068_51005005_15991527: "B组 回撤预算25%",
      A_v31_D22_51030070_51050013_15991517: "A组 回撤预算22%",
      A_v31_D25_51030070_51050005_15991525: "A组 回撤预算25%",
      B_default_D18: "B组 D18 严格防御",
      B_default_D20: "B组 D20 主线",
      B_default_D22: "B组 D22 平衡",
      A_default_D25: "A组 D25 成长对照"
    };
    const selectedSleeveFallback = {
      "510300": "510300_DTE30_D40_Q70_Hold",
      "510050": "510050_DTE30_D40_Q70_Hold",
      "510500": "510500_ETF_BuyHold",
      "159915": "159915_DTE30_D20_Q10_Hold",
      "588000": "588000_ETF_BuyHold"
    };
    const comparisonNames = Object.fromEntries((DATA.overviewComparisons?.options || []).map(row => [row.key, row.label]));
    function mainLineRows(key) {
      const main = rows(DATA.mainLine?.[key]);
      if (main.length) return main;
      return rows(DATA.stepC?.[key]);
    }
    function activeCandidateRows() {
      return mainLineRows("full_sample");
    }
    function activeCandidateWeights() {
      return mainLineRows("candidate_weights");
    }
    function activeCandidateNav() {
      return mainLineRows("daily_nav");
    }
    function activeCandidateDrawdowns() {
      return mainLineRows("drawdowns");
    }
    function activeRecommendations() {
      return mainLineRows("recommendations");
    }
    function overviewBacktestRows(candidateKeys, selectedKeys) {
      const selectedCandidateKeys = Array.from(candidateKeys || []).filter(Boolean);
      const selectedComparisonKeys = rows(DATA.overviewComparisons?.options)
        .map(row => row.key)
        .filter(key => selectedKeys?.has(key));
      const extraComparisonKeys = Array.from(selectedKeys || []).filter(key => !selectedComparisonKeys.includes(key));
      const legacySummary = rows(DATA.stepB?.legacy_portfolio_summary);
      const singleEtfRows = rows(DATA.stepA?.sleeves);
      const output = [];
      const seen = new Set();
      function push(row, key, source) {
        if (!row || !key || seen.has(key)) return;
        seen.add(key);
        output.push({
          ...row,
          backtest_key: key,
          backtest_label: labelCandidate(key),
          backtest_source: source
        });
      }
      selectedCandidateKeys.forEach(key => {
        const row = activeCandidateRows().find(item => item.portfolio_name === key);
        push(row, key, key === state.candidate ? "当前主线候选" : "勾选主线候选");
      });
      [...selectedComparisonKeys, ...extraComparisonKeys].forEach(key => {
        const portfolioRow = legacySummary.find(row => row.portfolio_name === key);
        if (portfolioRow) {
          const source = String(portfolioRow.portfolio_type || "").includes("Pure")
            ? "纯ETF固定权重"
            : "固定权重备兑";
          push(portfolioRow, key, source);
          return;
        }
        const sleeveRow = singleEtfRows.find(row => (row.sleeve_name || row.portfolio_name) === key);
        push(sleeveRow, key, "单ETF裸持");
      });
      return output;
    }

      const container = byId("overviewCompareControls");

      const candidateOptions = activeCandidateRows()
        .map(row => row.portfolio_name)
        .filter(name => name && name !== state.candidate);
      const options = rows(DATA.overviewComparisons?.options);
      if (state.tab !== "overview" || (!candidateOptions.length && !options.length)) {
        container.hidden = true;
        container.innerHTML = "";
        return;
      }
      container.hidden = false;
      const candidateControls = candidateOptions.length
        ? `<div class="compare-group">主线候选</div>${candidateOptions.map(name => `
          <label class="compare-option">

            <span>${esc(labelCandidate(name))}</span>
          </label>`).join("")}`
        : "";
      let currentGroup = "";
      const controls = options.map(option => {
        const groupLabel = option.group !== currentGroup ? `<div class="compare-group">${esc(option.group)}</div>` : "";
        currentGroup = option.group;
        return `${groupLabel}
          <label class="compare-option">
            <input type="checkbox" data-comparison-key="${esc(option.key)}"${state.comparisonKeys.has(option.key) ? " checked" : ""}>

      container.innerHTML = `<div class="compare-title">净值/回撤对比</div>${candidateControls}${controls}`;

    function renderInteractiveSurface(id, records, metricName, baselineRow = null) {
      const host = byId(id);
      if (!host) return;
      const valid = (records || []).filter(row =>
        num(row.moneyness_axis) !== null &&
        num(row.coverage) !== null &&
        num(row[metricName]) !== null
      );
      if (valid.length < 3) {
        host.innerHTML = `<div class="empty">暂无曲面数据</div>`;
        return;
      }
      const axisType = surfaceAxisType(valid);
      const xAxisLabel = surfaceXAxisLabel(valid);
      host.innerHTML = `<canvas aria-label="interactive parameter surface"></canvas><div class="surface-tooltip"></div>`;
      const canvas = host.querySelector("canvas");
      const tip = host.querySelector(".surface-tooltip");
      const ctx = canvas.getContext("2d");
      const xValues = Array.from(new Set(valid.map(row => num(row.moneyness_axis)))).sort((a, b) => a - b);
      const yValues = Array.from(new Set(valid.map(row => num(row.coverage)))).sort((a, b) => a - b);
      const zValues = valid.map(row => num(row[metricName]));
      const xMin = Math.min(...xValues), xMax = Math.max(...xValues);
      const yMin = Math.min(...yValues), yMax = Math.max(...yValues);
      const baselineValue = baselineRow ? num(baselineRow[metricName]) : null;
      const zDomainValues = baselineValue === null ? zValues : [...zValues, baselineValue];
      const zMin = Math.min(...zDomainValues), zMax = Math.max(...zDomainValues);
      const baselineNz = baselineValue === null ? null : normUnit(baselineValue, zMin, zMax);
      const best = sortSurfaceRows(valid, metricName)[0];
      const pointKey = (x, y) => `${Number(x).toFixed(12)}|${Number(y).toFixed(6)}`;
      const pointMap = new Map();
      const points = valid.map(row => {
        const x = num(row.moneyness_axis);
        const y = num(row.coverage);
        const z = num(row[metricName]);
        const p = {
          row,
          rawX: x,
          rawY: y,
          rawZ: z,
          nx: normUnit(x, xMin, xMax),
          ny: normUnit(y, yMin, yMax),
          nz: normUnit(z, zMin, zMax)
        };
        pointMap.set(pointKey(x, y), p);
        return p;
      });
      const triangles = [];
      for (let i = 0; i < xValues.length - 1; i += 1) {
        for (let j = 0; j < yValues.length - 1; j += 1) {
          const p00 = pointMap.get(pointKey(xValues[i], yValues[j]));
          const p10 = pointMap.get(pointKey(xValues[i + 1], yValues[j]));
          const p01 = pointMap.get(pointKey(xValues[i], yValues[j + 1]));
          const p11 = pointMap.get(pointKey(xValues[i + 1], yValues[j + 1]));
          if (p00 && p10 && p11) triangles.push([p00, p10, p11]);
          if (p00 && p11 && p01) triangles.push([p00, p11, p01]);
        }
      }
      let projectedPoints = [];
      let dragging = false;
      let lastX = 0;
      let lastY = 0;

      function resize() {
        const rect = host.getBoundingClientRect();
        const dpr = window.devicePixelRatio || 1;
        canvas.width = Math.max(1, Math.floor(rect.width * dpr));
        canvas.height = Math.max(1, Math.floor(rect.height * dpr));
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        draw(rect.width, rect.height);
      }

      function draw(width = host.clientWidth, height = host.clientHeight) {
        ctx.clearRect(0, 0, width, height);
        ctx.fillStyle = "#ffffff";
        ctx.fillRect(0, 0, width, height);
        const projected = new Map();
        for (const p of points) projected.set(p, projectSurfacePoint(p, width, height));

        const projectedTriangles = triangles.map(tri => {
          const pts = tri.map(p => projected.get(p));
          const zAvg = tri.reduce((sum, p) => sum + p.nz, 0) / tri.length;
          const depth = pts.reduce((sum, p) => sum + p.depth, 0) / pts.length;
          return { pts, zAvg, depth };
        }).sort((a, b) => a.depth - b.depth);

        drawSurfaceAxes(ctx, width, height, metricName, zMin, zMax, xAxisLabel);
        projectedTriangles.forEach(tri => {
          ctx.beginPath();
          ctx.moveTo(tri.pts[0].x, tri.pts[0].y);
          ctx.lineTo(tri.pts[1].x, tri.pts[1].y);
          ctx.lineTo(tri.pts[2].x, tri.pts[2].y);
          ctx.closePath();
          ctx.fillStyle = surfaceColor(tri.zAvg, 0.72);
          ctx.fill();
          ctx.strokeStyle = "rgba(255,255,255,0.42)";
          ctx.lineWidth = 0.55;
          ctx.stroke();
        });
        if (baselineNz !== null) drawBaselinePlane(ctx, width, height, metricName, baselineValue, baselineNz);

        projectedPoints = points.map(p => ({ ...projected.get(p), point: p }));
        projectedPoints.sort((a, b) => a.depth - b.depth).forEach(item => {
          const isBest = best && item.point.row.surface_point_id === best.surface_point_id;
          if (isBest) {
            drawStar(ctx, item.x, item.y, 8.5, "#bd4b43");
          } else {
            ctx.beginPath();
            ctx.arc(item.x, item.y, 3.5, 0, Math.PI * 2);
            ctx.fillStyle = "#263545";
            ctx.fill();
            ctx.strokeStyle = "#ffffff";
            ctx.lineWidth = 0.8;
            ctx.stroke();
          }
        });
        drawSurfaceColorBar(ctx, width, height, metricName, zMin, zMax);
        if (baselineValue !== null) drawBaselineBadge(ctx, width, height, metricName, baselineValue);
      }

      function showTooltip(event) {
        const rect = canvas.getBoundingClientRect();
        const x = event.clientX - rect.left;
        const y = event.clientY - rect.top;
        let nearest = null;
        let bestDistance = Infinity;
        for (const item of projectedPoints) {
          const distance = Math.hypot(item.x - x, item.y - y);
          if (distance < bestDistance) {
            bestDistance = distance;
            nearest = item;
          }
        }
        if (!nearest || bestDistance > 10) {
          tip.style.display = "none";
          return;
        }
        const row = nearest.point.row;
        const target = axisType === "target_delta"
          ? `Delta ${fmt(row.target_delta, 2)} / Effective ${fmt(row.parameter_depth, 4)}`
          : pct(row.target_moneyness);
        tip.innerHTML = `
          <b>${esc(row.etf_code)} ${esc(row.moneyness_label)} ${esc(row.coverage_label)}</b><br>
          ${esc(labelSurfaceMetric(metricName))}: ${esc(formatSurfaceMetric(metricName, row[metricName]))}<br>
          ${esc(xAxisLabel)}: ${esc(target)} / Coverage: ${esc(pct(row.coverage))}<br>
          CAGR: ${esc(cagrPct(row.annualized_return_cagr))} / MDD: ${esc(pct(row.max_drawdown))}`;
        tip.style.left = `${Math.max(8, Math.min(x + 12, rect.width - 252))}px`;
        tip.style.top = `${Math.max(8, y - 58)}px`;
        tip.style.display = "block";
      }

      canvas.addEventListener("pointerdown", event => {
        dragging = true;
        lastX = event.clientX;
        lastY = event.clientY;
        canvas.classList.add("dragging");
        tip.style.display = "none";
        canvas.setPointerCapture(event.pointerId);
      });
      canvas.addEventListener("pointermove", event => {
        if (!dragging) {
          showTooltip(event);
          return;
        }
        const dx = event.clientX - lastX;
        const dy = event.clientY - lastY;
        lastX = event.clientX;
        lastY = event.clientY;
        state.surfaceYaw += dx * 0.012;
        state.surfacePitch = Math.max(0.22, Math.min(1.24, state.surfacePitch + dy * 0.01));
        draw();
      });
      canvas.addEventListener("pointerup", event => {
        dragging = false;
        canvas.classList.remove("dragging");
        try { canvas.releasePointerCapture(event.pointerId); } catch (_err) {}
      });
      canvas.addEventListener("pointerleave", () => {
        if (!dragging) tip.style.display = "none";
      });
      setTimeout(resize, 0);
    }

    function normUnit(value, min, max) {
      const span = max - min || 1;
      return (value - min) / span;
    }

    function projectSurfacePoint(point, width, height) {
      const scale = Math.min(width, height) * 0.29;
      let x = (point.nx - 0.5) * 2.35;
      let y = (point.ny - 0.5) * 1.78;
      let z = (point.nz - 0.5) * 1.42;
      const cy = Math.cos(state.surfaceYaw), sy = Math.sin(state.surfaceYaw);
      const x1 = x * cy - y * sy;
      const y1 = x * sy + y * cy;
      const cp = Math.cos(state.surfacePitch), sp = Math.sin(state.surfacePitch);
      const y2 = y1 * cp - z * sp;
      const z2 = y1 * sp + z * cp;
      return {
        x: width / 2 + x1 * scale,
        y: height * 0.55 - z2 * scale,
        depth: y2
      };
    }

    function drawSurfaceAxes(ctx, width, height, metricName, zMin, zMax, xAxisLabel = "Target moneyness") {
      const axes = [
        [{ nx: 0, ny: 0, nz: 0 }, { nx: 1, ny: 0, nz: 0 }, xAxisLabel],
        [{ nx: 0, ny: 0, nz: 0 }, { nx: 0, ny: 1, nz: 0 }, "Coverage"],
        [{ nx: 0, ny: 0, nz: 0 }, { nx: 0, ny: 0, nz: 1 }, labelSurfaceMetric(metricName)]
      ];
      ctx.save();
      ctx.strokeStyle = "#b8c4cf";
      ctx.fillStyle = "#566575";
      ctx.lineWidth = 1;
      ctx.font = "11px Microsoft YaHei, Segoe UI, Arial";
      axes.forEach(([a, b, label]) => {
        const p1 = projectSurfacePoint(a, width, height);
        const p2 = projectSurfacePoint(b, width, height);
        ctx.beginPath();
        ctx.moveTo(p1.x, p1.y);
        ctx.lineTo(p2.x, p2.y);
        ctx.stroke();
        ctx.fillText(label, p2.x + 6, p2.y + 4);
      });
      ctx.fillText(`低 ${formatSurfaceMetric(metricName, zMin)}`, 12, height - 12);
      ctx.fillText(`高 ${formatSurfaceMetric(metricName, zMax)}`, 12, height - 28);
      ctx.restore();
    }

    function drawBaselinePlane(ctx, width, height, metricName, baselineValue, baselineNz) {
      const corners = [
        { nx: 0, ny: 0, nz: baselineNz },
        { nx: 1, ny: 0, nz: baselineNz },
        { nx: 1, ny: 1, nz: baselineNz },
        { nx: 0, ny: 1, nz: baselineNz }
      ].map(point => projectSurfacePoint(point, width, height));
      ctx.save();
      ctx.beginPath();
      ctx.moveTo(corners[0].x, corners[0].y);
      for (let i = 1; i < corners.length; i += 1) ctx.lineTo(corners[i].x, corners[i].y);
      ctx.closePath();
      ctx.fillStyle = "rgba(155, 106, 24, 0.14)";
      ctx.fill();
      ctx.setLineDash([5, 4]);
      ctx.strokeStyle = "rgba(155, 106, 24, 0.92)";
      ctx.lineWidth = 1.4;
      ctx.stroke();
      ctx.setLineDash([]);
      const labelPoint = corners[2];
      ctx.fillStyle = "#7c5312";
      ctx.font = "11px Microsoft YaHei, Segoe UI, Arial";
      ctx.fillText(`BuyHold ${formatSurfaceMetric(metricName, baselineValue)}`, labelPoint.x + 8, labelPoint.y - 4);
      ctx.restore();
    }

    function drawBaselineBadge(ctx, width, height, metricName, baselineValue) {
      const text = `BuyHold ${labelSurfaceMetric(metricName)}: ${formatSurfaceMetric(metricName, baselineValue)}`;
      ctx.save();
      ctx.font = "11px Microsoft YaHei, Segoe UI, Arial";
      const textWidth = ctx.measureText(text).width;
      const x = 12;
      const y = 16;
      ctx.fillStyle = "rgba(255, 248, 232, 0.94)";
      ctx.strokeStyle = "rgba(155, 106, 24, 0.65)";
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.roundRect(x, y, textWidth + 18, 24, 6);
      ctx.fill();
      ctx.stroke();
      ctx.fillStyle = "#7c5312";
      ctx.fillText(text, x + 9, y + 16);
      ctx.restore();
    }

    function drawSurfaceColorBar(ctx, width, height, metricName, zMin, zMax) {
      const x = width - 28;
      const y = 42;
      const h = Math.max(110, height - 98);
      ctx.save();
      for (let i = 0; i < h; i += 1) {
        const t = 1 - i / h;
        ctx.fillStyle = surfaceColor(t, 1);
        ctx.fillRect(x, y + i, 10, 1);
      }
      ctx.strokeStyle = "#8d99a6";
      ctx.strokeRect(x, y, 10, h);
      ctx.fillStyle = "#4c5b6b";
      ctx.font = "10px Microsoft YaHei, Segoe UI, Arial";
      ctx.fillText(formatSurfaceMetric(metricName, zMax), x - 4, y - 8);
      ctx.fillText(formatSurfaceMetric(metricName, zMin), x - 4, y + h + 16);
      ctx.restore();
    }

    function surfaceColor(t, alpha = 1) {
      const clamped = Math.max(0, Math.min(1, t));
      const hue = 218 - clamped * 158;
      const light = 44 + clamped * 12;
      return `hsla(${hue}, 62%, ${light}%, ${alpha})`;
    }

    function drawStar(ctx, cx, cy, radius, fill) {
      ctx.save();
      ctx.beginPath();
      for (let i = 0; i < 10; i += 1) {
        const r = i % 2 === 0 ? radius : radius * 0.45;
        const a = -Math.PI / 2 + i * Math.PI / 5;
        const x = cx + Math.cos(a) * r;
        const y = cy + Math.sin(a) * r;
        if (i === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      }
      ctx.closePath();
      ctx.fillStyle = fill;
      ctx.fill();
      ctx.strokeStyle = "#ffffff";
      ctx.lineWidth = 1.1;
      ctx.stroke();
      ctx.restore();
    }

    function table(records, cols, options = {}) {
      if (!records || !records.length) return `<div class="empty">暂无数据</div>`;
      const sortableId = options.sortableId || "";
      const sortState = options.sortState || {};
      const hasPeriod = options.showPeriod !== false && records.some(row =>
        row && (row.sample_start || row.sample_end || row.window_start || row.window_end)
      );
      const displayCols = hasPeriod && !cols.some(col => col[0] === "backtest_period")
        ? [...cols, ["backtest_period", "回测周期", formatBacktestPeriod, "long-text"]]
        : cols;
      const headers = displayCols.map(col => {
        if (!sortableId) return `<th>${esc(col[1])}</th>`;
        const active = sortState.key === col[0] && sortState.direction;
        const icon = active ? (sortState.direction === "desc" ? "↓" : "↑") : "↕";
        const title = active
          ? (sortState.direction === "desc" ? "当前高到低；再次点击改为低到高" : "当前低到高；再次点击复原")
          : "点击按此列从高到低排序";
        return `<th class="sortable"><button type="button" class="sort-button${active ? " active" : ""}" data-table-sort="${esc(sortableId)}" data-sort-key="${esc(col[0])}" title="${esc(title)}"><span>${esc(col[1])}</span><span class="sort-icon">${esc(icon)}</span></button></th>`;
      }).join("");
      return `<div class="table-wrap"><table><thead><tr>${headers}</tr></thead><tbody>${
        records.map(row => `<tr>${displayCols.map(col => {
          const raw = row[col[0]];
          const formatter = col[2];
          const value = formatter ? formatter(raw, row) : raw;
          const klass = col[3] || "";
          return `<td class="${esc(klass)}" title="${esc(raw)}">${esc(value)}</td>`;
        }).join("")}</tr>`).join("")
      }</tbody></table></div>`;
    }

    function scaleLinear(domainMin, domainMax, rangeMin, rangeMax) {
      const span = domainMax - domainMin || 1;
      return value => rangeMin + (value - domainMin) / span * (rangeMax - rangeMin);
    }

    function lineChart(id, records, xField, yField, groupField, options = {}) {
      const container = byId(id);
      if (!container) return;
      container.classList.add("with-legend");
      const valid = (records || []).filter(row => num(row[yField]) !== null && row[xField] !== null && row[xField] !== undefined);
      if (!valid.length) {
        container.innerHTML = `<div class="empty">暂无图表数据</div>`;
        return;
      }
      const width = 760;
      const height = 280;
      const left = 48;
      const right = 16;
      const top = 16;
      const bottom = options.xLabel || options.xTicks ? 50 : 34;
      const xVals = valid.map(row => xToNumber(row[xField]));
      const yVals = valid.map(row => num(row[yField]));
      const xMin = Math.min(...xVals), xMax = Math.max(...xVals);
      let yMin = Math.min(...yVals), yMax = Math.max(...yVals);
      const pad = (yMax - yMin || Math.abs(yMax) || 1) * 0.08;
      yMin -= pad; yMax += pad;
      if (options.zeroMin) yMin = Math.min(0, yMin);
      const sx = scaleLinear(xMin, xMax, left, width - right);
      const sy = scaleLinear(yMin, yMax, height - bottom, top);
      const groups = Array.from(groupBy(valid, groupField).entries());
      const yTicks = [yMin, (yMin + yMax) / 2, yMax];
      const xTicks = (options.xTicks || []).map(xToNumber).filter(Number.isFinite);
      const xTickMarkup = xTicks.map(t => {
        const x = sx(t);
        const label = (options.xFormat || fmt)(t);
        return `
          <line class="axis" x1="${x}" x2="${x}" y1="${height - bottom}" y2="${height - bottom + 4}"></line>
          <text x="${x}" y="${height - bottom + 17}" text-anchor="middle" font-size="10" fill="#627083">${esc(label)}</text>`;
      }).join("");
      const xAxisLabel = options.xLabel
        ? `<text x="${(left + width - right) / 2}" y="${height - 6}" text-anchor="middle" font-size="10" fill="#627083">${esc(options.xLabel)}</text>`
        : "";
      const paths = groups.map(([name, items], index) => {
        const ordered = [...items].sort((a, b) => xToNumber(a[xField]) - xToNumber(b[xField]));
        const d = ordered.map((row, i) => `${i ? "L" : "M"}${sx(xToNumber(row[xField])).toFixed(1)},${sy(num(row[yField])).toFixed(1)}`).join(" ");
        const active = !options.highlight || name === options.highlight;
        const opacity = active ? 1 : (options.dimOpacity ?? 0.3);
        return `<path class="line" d="${d}" stroke="${colorFor(index)}" opacity="${opacity}" />`;
      }).join("");
      const legend = groups.map(([name], index) => {
        const active = !options.highlight || name === options.highlight;
        const klass = active ? "active" : "dim";
        return `<span class="${klass}"><i class="dot" style="background:${colorFor(index)}"></i>${esc(labelCandidate(name))}</span>`;
      }).join("");
      container.innerHTML = `
        <svg viewBox="0 0 ${width} ${height}" preserveAspectRatio="none">
          ${yTicks.map(t => `<line class="gridline" x1="${left}" x2="${width - right}" y1="${sy(t)}" y2="${sy(t)}"></line><text x="8" y="${sy(t) + 4}" font-size="10" fill="#627083">${esc((options.valueFormat || fmt)(t))}</text>`).join("")}
          <line class="axis" x1="${left}" x2="${width - right}" y1="${height - bottom}" y2="${height - bottom}"></line>
          <line class="axis" x1="${left}" x2="${left}" y1="${top}" y2="${height - bottom}"></line>
          ${xTickMarkup}
          ${xAxisLabel}
          ${paths}
        </svg>
        <div class="legend">${legend}</div>`;
    }

    function xToNumber(value) {
      if (typeof value === "number") return value;
      const parsed = Date.parse(value);
      if (Number.isFinite(parsed)) return parsed;
      return num(value) ?? 0;
    }

    function barChart(id, records, valueField, labelFn, options = {}) {
      const container = byId(id);
      if (container) container.classList.remove("with-legend");
      const valid = (records || []).filter(row => num(row[valueField]) !== null);
      if (!valid.length) {
        container.innerHTML = `<div class="empty">暂无图表数据</div>`;
        return;
      }
      const width = 760;
      const rowH = options.rowH || 22;
      const left = options.left || 170;
      const right = options.right || 52;
      const top = 8;
      const labelFont = options.labelFontSize || 10;
      const valueFont = options.valueFontSize || 10;
      const barH = options.barHeight || 12;
      const height = Math.max(160, top * 2 + valid.length * rowH);
      const values = valid.map(row => num(row[valueField]));
      const min = Math.min(0, ...values);
      const max = options.maxValue ?? Math.max(0, ...values);
      const sx = scaleLinear(min, max, left, width - right);
      const zero = sx(0);
      const labelClipId = `${id}-label-clip`.replace(/[^a-zA-Z0-9_-]/g, "-");
      const labelClipWidth = Math.max(24, left - 14);
      const bars = valid.map((row, index) => {
        const value = num(row[valueField]);
        const x = Math.min(zero, sx(value));
        const w = Math.abs(sx(value) - zero);
        const y = top + index * rowH;
        const textY = y + Math.floor(rowH / 2) + 4;
        const barY = y + Math.max(3, Math.floor((rowH - barH) / 2));
        const color = value >= 0 ? colorFor(index) : "#bd4b43";
        const label = labelFn(row);
        const valueText = (options.valueFormat || fmt)(value);
        return `
          <g>
            <title>${esc(label)} ${esc(valueText)}</title>
            <text x="6" y="${textY}" font-size="${labelFont}" fill="#4c5b6b" clip-path="url(#${labelClipId})">${esc(label)}</text>
            <rect class="bar" x="${x}" y="${barY}" width="${Math.max(w, 1)}" height="${barH}" rx="2" fill="${color}"></rect>
            <text x="${width - 6}" y="${textY}" text-anchor="end" font-size="${valueFont}" fill="#4c5b6b">${esc(valueText)}</text>
          </g>`;
      }).join("");
      container.innerHTML = `
        <svg viewBox="0 0 ${width} ${height}" preserveAspectRatio="none">
          <defs>
            <clipPath id="${labelClipId}">
              <rect x="0" y="0" width="${labelClipWidth}" height="${height}"></rect>
            </clipPath>
          </defs>
          <line class="axis" x1="${zero}" x2="${zero}" y1="4" y2="${height - 4}"></line>
          ${bars}
        </svg>`;
    }

    function scatter3dChart(id, records) {
      const container = byId(id);
      if (!container) return;
      container.classList.add("with-legend");
      const valid = (records || []).filter(row =>
        num(row.moneyness_axis) !== null &&
        num(row.coverage_axis) !== null &&
        num(row.sharpe_daily_mean) !== null
      );
      if (!valid.length) {
        container.innerHTML = `<div class="empty">暂无 3D 诊断数据</div>`;
        return;
      }
      const width = 760;
      const height = 300;
      const origin = { x: 126, y: 246 };
      const xLen = 500;
      const yDx = 82;
      const yDy = 88;
      const zLen = 178;
      const xs = valid.map(row => num(row.moneyness_axis));
      const ys = valid.map(row => num(row.coverage_axis));
      const zs = valid.map(row => num(row.sharpe_daily_mean));
      const xMin = Math.min(0, ...xs);
      const xMax = Math.max(...xs);
      const yMin = Math.min(0, ...ys);
      const yMax = Math.max(1, ...ys);
      const zMin = Math.min(0, ...zs);
      const zMax = Math.max(...zs);
      const norm = (value, min, max) => {
        const span = max - min || 1;
        return (value - min) / span;
      };
      const project = row => {
        const x = norm(num(row.moneyness_axis), xMin, xMax);
        const y = norm(num(row.coverage_axis), yMin, yMax);
        const z = norm(num(row.sharpe_daily_mean), zMin, zMax);
        return {
          x: origin.x + x * xLen - y * yDx,
          y: origin.y - y * yDy - z * zLen,
          depth: y,
        };
      };
      const etfs = Array.from(new Set(valid.map(row => String(row.etf_code)))).sort();
      const colorMap = Object.fromEntries(etfs.map((etf, index) => [etf, colorFor(index)]));
      const axis = `
        <line class="axis" x1="${origin.x}" y1="${origin.y}" x2="${origin.x + xLen}" y2="${origin.y}"></line>
        <line class="axis" x1="${origin.x}" y1="${origin.y}" x2="${origin.x - yDx}" y2="${origin.y - yDy}"></line>
        <line class="axis" x1="${origin.x}" y1="${origin.y}" x2="${origin.x}" y2="${origin.y - zLen}"></line>
        <text x="${origin.x + xLen + 8}" y="${origin.y + 4}" font-size="10" fill="#627083">虚值</text>
        <text x="${origin.x - yDx - 32}" y="${origin.y - yDy - 4}" font-size="10" fill="#627083">覆盖率</text>
        <text x="${origin.x - 30}" y="${origin.y - zLen - 8}" font-size="10" fill="#627083">Sharpe</text>
        <text x="${origin.x}" y="${origin.y + 17}" text-anchor="middle" font-size="9" fill="#627083">${pct(xMin, 0)}</text>
        <text x="${origin.x + xLen}" y="${origin.y + 17}" text-anchor="middle" font-size="9" fill="#627083">${pct(xMax, 1)}</text>
        <text x="${origin.x - yDx - 4}" y="${origin.y - yDy + 13}" text-anchor="end" font-size="9" fill="#627083">${pct(yMax, 0)}</text>
        <text x="${origin.x - 8}" y="${origin.y - zLen + 4}" text-anchor="end" font-size="9" fill="#627083">${fmt(zMax, 2)}</text>
        <text x="${origin.x - 8}" y="${origin.y + 4}" text-anchor="end" font-size="9" fill="#627083">${fmt(zMin, 2)}</text>`;
      const ordered = [...valid].sort((a, b) => project(b).depth - project(a).depth);
      const points = ordered.map(row => {
        const p = project(row);
        const role = String(row.point_role || "");
        const radius = role === "primary" ? 5.4 : role === "backup" ? 4.8 : 3.9;
        const stroke = role === "primary" ? "#16222f" : "#ffffff";
        const label = row.display_name || `${row.etf_code} ${labelSleeveChart(row.sleeve_name)}`;
        const valueText = `虚值 ${pct(row.moneyness_axis)} / 覆盖 ${pct(row.coverage_axis)} / Sharpe ${fmt(row.sharpe_daily_mean, 3)}`;
        const text = role === "primary"
          ? `<text x="${p.x + 7}" y="${p.y - 6}" font-size="9" fill="#2d3d4d">${esc(labelSleeveChart(row.sleeve_name))}</text>`
          : "";
        return `
          <g>
            <title>${esc(label)}&#10;${esc(valueText)}</title>
            <circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="${radius}" fill="${colorMap[String(row.etf_code)]}" stroke="${stroke}" stroke-width="1.1" opacity="0.9"></circle>
            ${text}
          </g>`;
      }).join("");
      const legend = etfs.map(etf => `<span><i class="dot" style="background:${colorMap[etf]}"></i>${esc(etf)}</span>`).join("");
      container.innerHTML = `
        <svg viewBox="0 0 ${width} ${height}" preserveAspectRatio="none">
          ${axis}
          ${points}
        </svg>
        <div class="legend">${legend}</div>`;
    }

    function stackedWeightChart(id, records) {
      const container = byId(id);
      if (container) container.classList.add("with-legend");
      const valid = (records || []).filter(row => row.frontier_status === "feasible");
      if (!valid.length) {
        container.innerHTML = `<div class="empty">暂无图表数据</div>`;
        return;
      }
      const assets = ["510300", "510050", "510500", "159915"];
      const assetColors = { "510300": "#2f6fbd", "510050": "#23858b", "510500": "#9b6a18", "159915": "#247a5a" };
      const width = 760, height = 220, left = 72, right = 18, top = 18, bottom = 36;
      const barW = (width - left - right) / valid.length * 0.7;
      const gap = (width - left - right) / valid.length * 0.3;
      const bars = valid.map((row, i) => {
        let y = height - bottom;
        const x = left + i * (barW + gap + 1);
        const rects = assets.map(asset => {
          const value = num(row[`weight_${asset}`]) || 0;
          const h = value * (height - top - bottom);
          y -= h;
          return `<rect x="${x}" y="${y}" width="${barW}" height="${h}" fill="${assetColors[asset]}" opacity="0.92"></rect>`;
        }).join("");
        return `${rects}<text x="${x + barW / 2}" y="${height - 14}" text-anchor="middle" font-size="9" fill="#627083">${esc(row.universe_short)}${Math.round(num(row.D_star) * 100)}</text>`;
      }).join("");
      const legend = assets.map(asset => `<span><i class="dot" style="background:${assetColors[asset]}"></i>${asset}</span>`).join("");
      container.innerHTML = `
        <svg viewBox="0 0 ${width} ${height}" preserveAspectRatio="none">
          <line class="axis" x1="${left}" x2="${width - right}" y1="${height - bottom}" y2="${height - bottom}"></line>
          ${bars}
        </svg>
        <div class="legend">${legend}</div>`;
    }

    init();
  </script>
</body>
</html>
