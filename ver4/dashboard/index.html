      }).join("");
      const xLabels = [xTicks[0], xTicks.at(-1)].map((value, index) => `<text x="${index ? width - right : left}" y="${height - 13}" text-anchor="${index ? "end" : "start"}" font-size="11" fill="#40515f">${pct(value)}</text>`).join("");
      el.innerHTML = `<svg viewBox="0 0 ${width} ${height}" role="img" aria-label="${esc(aria)}">${grid}<line x1="${sx(0)}" x2="${sx(0)}" y1="${top}" y2="${height - bottom}" stroke="#607482" stroke-width="1.35"/><line x1="${left}" x2="${width - right}" y1="${sy(0)}" y2="${sy(0)}" stroke="#607482" stroke-width="1.35"/>${dots}${xLabels}<text x="${left + (width - left - right) / 2}" y="${height - 3}" text-anchor="middle" font-size="11" fill="#40515f">${esc(xLabel)}</text></svg><div class="legend"><span><i style="background:${colors.net}"></i>买回后相对原备兑改善</span><span><i style="background:${colors.negative}"></i>买回后相对原备兑下降</span><span>方形 = 原备兑最终会行权</span></div>`;
    }

    function deltaTriggerAttributionTable(items) {
      const root = byId("deltaTriggerAttributionTable");
      if (!root) return;
      const categories = ["周期末仍高于买回日", "期间继续上涨后回落", "买回后未再上涨"];
      const rowsHtml = categories.map(category => {
        const group = items.filter(item => item.category === category);
        if (!group.length) return `<tr><td class="left">${category}</td><td>0</td><td>--</td><td>--</td><td>--</td><td>--</td></tr>`;
        const average = field => group.reduce((sum, item) => sum + item[field], 0) / group.length;
        return `<tr><td class="left">${category}</td><td>${group.length}</td><td>${pct(average("postReturn"))}</td><td>${pct(average("postMaxReturn"))}</td><td>${pct(average("strategyChange"))}</td><td>${group.filter(item => item.wouldAssign).length} / ${group.length}</td></tr>`;
      }).join("");
      root.innerHTML = `<div class="table-wrap"><table><thead><tr><th class="left">买回后路径</th><th>触发期数</th><th>买回后 ETF 至周期末</th><th>买回后最大继续上涨</th><th>平均策略变化</th><th>原备兑会行权</th></tr></thead><tbody>${rowsHtml}</tbody></table></div>`;
    }

    function renderDeltaTriggerAttribution(records) {
      const kpis = byId("deltaTriggerAttributionKpis");
      const endChart = byId("deltaTriggerEndScatter"), maxChart = byId("deltaTriggerMaxScatter");
      if (!kpis || !endChart || !maxChart) return;
      if (state.earlyclose.rule !== "delta") {
        kpis.innerHTML = `<div class="empty">该归因模块仅针对 Delta 买回。切换至 Delta 买回后，可观察高 Delta 触发后的实际 ETF 路径。</div>`;
        endChart.innerHTML = ""; maxChart.innerHTML = "";
        const table = byId("deltaTriggerAttributionTable"); if (table) table.innerHTML = "";
        return;
      }
      if (!earlyCloseDailyCache.delta) {
        kpis.innerHTML = `<div class="empty">正在读取 Delta 触发后的日频路径，用于归因分析…</div>`;
        endChart.innerHTML = ""; maxChart.innerHTML = "";
        ensureEarlyCloseDailyData().then(() => {
          if (state.tab === "earlyclose" && state.earlyclose.rule === "delta") renderDeltaTriggerAttribution(earlyCloseRecords());
        });
        return;
      }
      const items = deltaTriggerPathItems(records);
      if (!items.length) {
        kpis.innerHTML = `<div class="empty">当前 Delta 阈值下没有可归因的实际触发周期。</div>`;
        endChart.innerHTML = ""; maxChart.innerHTML = "";
        deltaTriggerAttributionTable([]);
        return;
      }
      const average = field => items.reduce((sum, item) => sum + item[field], 0) / items.length;
      const positiveChanges = items.filter(item => item.strategyChange > 0).length;
      kpis.innerHTML = `<div class="selection-metrics"><div><span>实际 Delta 触发</span><strong>${items.length} / ${records.length}</strong></div><div><span>买回后周期末仍上涨</span><strong>${pct(items.filter(item => item.postReturn > 0).length / items.length)}</strong></div><div><span>买回后最大继续上涨中位数</span><strong>${pct(median(items.map(item => item.postMaxReturn)))}</strong></div><div><span>买回相对原备兑变化中位数</span><strong>${pct(median(items.map(item => item.strategyChange)))}</strong></div><div><span>买回后策略改善</span><strong>${positiveChanges} / ${items.length}</strong></div><div><span>原备兑原本会行权</span><strong>${items.filter(item => item.wouldAssign).length} / ${items.length}</strong></div></div>`;
      deltaTriggerPathScatter("deltaTriggerEndScatter", items, "postReturn", "买回后 ETF 至周期末收益", "Delta 买回后 ETF 期末涨跌与策略变化");
      deltaTriggerPathScatter("deltaTriggerMaxScatter", items, "postMaxReturn", "买回后 ETF 最大继续上涨", "Delta 买回后最大继续上涨与策略变化");
      deltaTriggerAttributionTable(items);
    }

    function truthyFlag(value) {
      return value === true || value === 1 || value === "1" || value === "true" || value === "True";
    }

    function earlyCloseKpis() {
      const summary = earlyCloseSummary();
      if (!Object.keys(summary).length) return `<div class="panel span-12"><div class="empty">暂未找到该 ETF 与策略的提前平仓回放结果。</div></div>`;
      const change = num(summary.net_option_yield_change_sum) || 0;
      return [
        kpi("触发买回", `${fmt(summary.buyback_count, 0)} / ${fmt(summary.selected_cycle_count, 0)}`, `${earlyCloseLabel(summary)}；首次满足条件即回购`, ""),
        kpi("行权次数：基线 / 买回后", `${fmt(summary.baseline_assignment_count, 0)} / ${fmt(summary.residual_assignment_count, 0)}`, "提前平仓后不再开新仓", ""),
        kpi("期权腿累计变化", pct(change), `基线 ${pct(summary.baseline_net_option_yield_sum)}；买回后 ${pct(summary.delta_buyback_net_option_yield_sum)}`, change >= 0 ? "positive" : "negative"),
        kpi("完整策略累计变化", pct(summary.strategy_return_change_sum), "ETF 底仓收益不变；变化全部来自期权腿", (num(summary.strategy_return_change_sum) || 0) >= 0 ? "positive" : "negative")
      ].join("");
    }

    function earlyCloseTimeline(id, records) {
      const el = byId(id);
      if (!el) return;
      if (!records.length) { el.innerHTML = `<div class="empty">暂无可比较的逐期数据。</div>`; return; }
      const width = 980, height = 290, left = 46, right = 16, top = 18, bottom = 46;
      const values = records.flatMap(row => [num(row.baseline_net_option_yield) || 0, num(row.net_option_yield) || 0]);
      const domain = chartDomain(values);
      const sy = value => scale(value, domain.min, domain.max, height - bottom, top);
      const zero = sy(0), band = (width - left - right) / records.length, bar = Math.max(3, Math.min(13, band * 0.27));
      const selectedCycleIds = new Set(state.earlyclose.selectedCycleIds || []);
      const triggerBands = records.map((row, index) => {
        if (!truthyFlag(row.buyback_triggered)) return "";
        const improved = (num(row.delta_buyback_strategy_change) || 0) >= 0;
        const fill = improved ? "#dff1e7" : "#f8e3e1";
        const verdict = improved ? "本期提前平仓后完整策略收益提升" : "本期提前平仓后完整策略收益下降";
        return `<rect x="${left + index * band}" y="${top}" width="${band}" height="${height - top - bottom}" fill="${fill}" pointer-events="none"><title>${verdict}</title></rect>`;
      }).join("");
      const selectedBands = records.map((row, index) => {
        if (!selectedCycleIds.has(row.cycle_id)) return "";
        return `<rect x="${left + index * band + 1}" y="${top + 1}" width="${Math.max(1, band - 2)}" height="${height - top - bottom - 2}" fill="none" stroke="${colors.premium}" stroke-width="1.6" pointer-events="none"><title>已选诊断周期</title></rect>`;
      }).join("");
      const bars = records.map((row, index) => {
        const x = left + index * band + band / 2;
        const base = num(row.baseline_net_option_yield) || 0;
        const overlay = num(row.net_option_yield) || 0;
        const detail = `${row.rebalance_date} 至 ${row.period_end_date}\n基线净期权收益：${pct(base)}\n买回后：${pct(overlay)}\n${truthyFlag(row.buyback_triggered) ? `触发：${row.buyback_date}，${earlyCloseTriggerDetail(row)}` : "本期未触发买回"}`;
        const rect = (offset, value, fill) => {
          const y = Math.min(zero, sy(value));
          return `<rect x="${x + offset - bar / 2}" y="${y}" width="${bar}" height="${Math.max(1, Math.abs(sy(value) - zero))}" fill="${fill}">${svgTitle(detail)}</rect>`;
        };
        const trigger = truthyFlag(row.buyback_triggered) ? `<circle cx="${x}" cy="${top + 7}" r="3.4" fill="${colors.relative}"><title>本期触发提前买回</title></circle>` : "";
        const isSelected = selectedCycleIds.has(row.cycle_id);
        const action = isSelected ? "取消选择" : "选择诊断周期";
        return `<g data-earlyclose-timeline-cycle="${esc(row.cycle_id)}" role="button" tabindex="0" aria-pressed="${isSelected}" aria-label="${action}：${esc(detail).replace(/\n/g, "，")}" style="cursor:pointer">${rect(-bar * 0.58, base, "#9ba8b1")}${rect(bar * 0.58, overlay, "#18212f")}${trigger}</g>`;
      }).join("");
      const ticks = [0, Math.floor(records.length / 2), records.length - 1].filter((value, index, all) => all.indexOf(value) === index).map(index => `<text x="${left + index * band + band / 2}" y="${height - 13}" text-anchor="middle" font-size="10" fill="#5e6a79">${esc(String(records[index].rebalance_date).slice(0, 7))}</text>`).join("");
      el.innerHTML = `<svg viewBox="0 0 ${width} ${height}" role="img" aria-label="基线与提前买回后的逐期净期权收益对比">${triggerBands}<line x1="${left}" x2="${width - right}" y1="${zero}" y2="${zero}" stroke="#9eabb5"/>${bars}${selectedBands}<text x="5" y="${top + 4}" font-size="10" fill="#5e6a79">${pct(domain.max)}</text><text x="5" y="${height - bottom}" font-size="10" fill="#5e6a79">${pct(domain.min)}</text>${ticks}</svg><div class="legend"><span><i style="background:#9ba8b1"></i>原备兑净期权收益</span><span><i style="background:#18212f"></i>提前买回后净期权收益</span><span><i style="background:${colors.relative}"></i>本期触发买回</span><span><i style="background:#dff1e7"></i>触发后完整策略提升</span><span><i style="background:#f8e3e1"></i>触发后完整策略下降</span><span><i style="background:${colors.premium}"></i>已选诊断周期</span></div>`;
      el.querySelectorAll("[data-earlyclose-timeline-cycle]").forEach(mark => {
        const selectCycle = () => {
          const cycleId = mark.dataset.earlycloseTimelineCycle;
          const selected = new Set(state.earlyclose.selectedCycleIds || []);
          if (selected.has(cycleId)) {
            selected.delete(cycleId);
            if (state.earlyclose.activeCycleId === cycleId) state.earlyclose.activeCycleId = [...selected].at(-1) || null;
          } else {
            selected.add(cycleId);
            state.earlyclose.activeCycleId = cycleId;
          }
          state.earlyclose.selectedCycleIds = [...selected];
          earlyCloseTimeline(id, records);
          renderEarlyClosePathDiagnostics(records);
        };
        mark.addEventListener("click", selectCycle);
        mark.addEventListener("keydown", event => {
          if (event.key === "Enter" || event.key === " ") { event.preventDefault(); selectCycle(); }
        });
      });
    }

    function earlyCloseSummaryTable(records) {
      if (!records.length) return `<div class="empty">暂无阈值回放结果。</div>`;
      return `<div class="table-wrap"><table><thead><tr><th class="left">买回规则</th><th>触发次数</th><th>行权：基线 / 买回后</th><th>基线净期权收益</th><th>买回后净期权收益</th><th>期权腿变化</th><th>完整策略变化</th></tr></thead><tbody>${records.map(row => `<tr><td class="left">${esc(earlyCloseLabel(row))}</td><td>${fmt(row.buyback_count, 0)} / ${fmt(row.selected_cycle_count, 0)}</td><td>${fmt(row.baseline_assignment_count, 0)} / ${fmt(row.residual_assignment_count, 0)}</td><td>${pct(row.baseline_net_option_yield_sum)}</td><td>${pct(row.delta_buyback_net_option_yield_sum)}</td><td>${pct(row.net_option_yield_change_sum)}</td><td>${pct(row.strategy_return_change_sum)}</td></tr>`).join("")}</tbody></table></div>`;
    }

    function earlyCloseTriggerTable(records) {
      const triggered = records.filter(row => truthyFlag(row.buyback_triggered));
      if (!triggered.length) return `<div class="empty">当前阈值下没有发生提前买回。</div>`;
      return `<div class="table-wrap"><table><thead><tr><th class="left">开仓至周期结束</th><th class="left">买回日</th><th>${earlyCloseTriggerMetricLabel()}</th><th>剩余到期日</th><th>开仓权利金</th><th>买回成本</th><th>基线净期权收益</th><th>买回后净期权收益</th><th>本期变化</th><th>原本会行权</th></tr></thead><tbody>${triggered.map(row => `<tr><td class="left">${esc(row.rebalance_date)} 至 ${esc(row.period_end_date)}</td><td class="left">${esc(row.buyback_date)}</td><td>${earlyCloseTriggerMetric(row)}</td><td>${fmt(row.buyback_remaining_dte, 0)} 天</td><td>${pct(row.gross_premium_yield)}</td><td>-${pct(row.buyback_liability_yield)}</td><td>${pct(row.baseline_net_option_yield)}</td><td>${pct(row.net_option_yield)}</td><td>${pct(row.delta_buyback_net_option_change)}</td><td>${truthyFlag(row.baseline_assignment_flag) ? "是" : "否"}</td></tr>`).join("")}</tbody></table></div>`;
    }

    function renderEarlyClose() {
      const hasTp80 = rows(DATA.tp80_buyback?.summary).length > 0;
      if (state.earlyclose.rule !== "delta" && state.earlyclose.rule !== "tp80") state.earlyclose.rule = "delta";
      if (state.earlyclose.rule === "tp80" && !hasTp80) state.earlyclose.rule = "delta";
      const allSummaries = earlyCloseSummaries();
      const available = allSummaries.map(earlyCloseParameter).filter(value => value !== null);
      if (!available.length) { byId("content").innerHTML = `<div class="panel"><div class="empty">尚未生成该买回规则的实验数据。</div></div>`; return; }
      if (!available.some(value => Math.abs(value - Number(state.earlyclose.threshold)) < 1e-8)) state.earlyclose.threshold = available[0];
      const records = earlyCloseRecords();
      syncEarlyCloseCycles(records);
      const parameterControl = state.earlyclose.rule === "delta"
        ? `<div class="period-control"><label for="earlyCloseThreshold">Delta 阈值</label><select id="earlyCloseThreshold">${available.map(value => `<option value="${value}"${Math.abs(value - Number(state.earlyclose.threshold)) < 1e-8 ? " selected" : ""}>Delta ≥ ${value.toFixed(2)}</option>`).join("")}</select></div>`
        : `<span class="tag">TP80：回购价 ≤ 开仓期权价格的 20%</span>`;
      byId("content").innerHTML = `
        <div class="grid">
          <div class="panel span-12"><div class="toolbar"><h2>提前买回规则与执行口径</h2><div class="period-control"><label for="earlyCloseRule">买回规则</label><select id="earlyCloseRule"><option value="delta"${state.earlyclose.rule === "delta" ? " selected" : ""}>Delta 买回</option>${hasTp80 ? `<option value="tp80"${state.earlyclose.rule === "tp80" ? " selected" : ""}>TP80 买回</option>` : ""}</select>${parameterControl}</div></div><div class="note">${esc(earlyCloseAssumptionText())}</div></div>
          <div class="panel span-8"><div class="toolbar"><h2>逐期净期权收益：原备兑 vs. 提前买回</h2><span class="tag">点击柱组选择或取消周期</span></div><div id="earlyCloseTimeline" class="chart"></div><div class="note">灰柱为原备兑期权腿最终净收益，深色柱为本规则下的结果；金色圆点表示当期发生提前买回。点击任一柱组可选择对应周期，再次点击即可取消；蓝框表示已选周期。</div></div>
          <div class="panel span-4"><h2>规则参数对比</h2>${earlyCloseSummaryTable(allSummaries)}</div>
          <div class="panel span-4 span-row-2"><div class="toolbar"><h2>选择诊断周期</h2><div class="selection-toolbar-actions"><button id="earlyCloseClearSelection" type="button">清空选择</button><span id="earlyCloseSelectedCount" class="tag">0 期已选</span></div></div><div class="note">勾选一个或多个开仓周期；最近一次勾选的周期用于右侧日频盯市。每条路径都以开仓日为基准，不跨周期累加。</div><div id="earlyCloseCycleChecklist" class="cycle-checklist"></div></div>
          <div class="panel span-8"><div class="toolbar"><h2>所选周期日频盯市路径</h2><span class="tag">开仓日为 0%</span></div><div id="earlyCloseDailyPath" class="chart"></div><div class="subchart-heading"><h3>卖出 Call 的日末标记价格</h3><span class="tag">元/份</span></div><div id="earlyCloseOptionPrice" class="chart daily-path-price-chart"></div><div class="note">上图为 ETF、原备兑与提前买回的相对开仓日盯市收益；下图为同一张合约的日末标记价格。横轴按真实日期间隔绘制，虚线标记买回日；买回后保留期权价格仅用于观察后续市场路径，不代表仍持有该合约。</div></div>
          <div class="panel span-8"><h2>日频路径诊断</h2><div id="earlyCloseDailyDetail"></div><div class="note">日频盯市收益为相对本期开仓日的累计估值变化，用于观察持有期风险路径；不是逐日收益相加，也不是跨周期复利净值。</div></div>
          <div class="panel span-12"><div class="toolbar"><h2>Delta 触发后的路径归因</h2><span class="tag warn">使用买回日后的未来路径</span></div><div id="deltaTriggerAttributionKpis"></div><div class="attribution-grid"><div><h3>买回后 ETF 期末涨跌与策略变化</h3><div id="deltaTriggerEndScatter" class="chart"></div></div><div><h3>买回后最大继续上涨与策略变化</h3><div id="deltaTriggerMaxScatter" class="chart"></div></div></div><div id="deltaTriggerAttributionTable" class="attribution-table"></div><div class="note">每个点是一笔实际触发 Delta 买回的周期。纵轴为“提前买回后的完整策略收益 − 原备兑收益”，ETF 底仓路径本身未改变，因此差异全部来自期权腿。该模块用于解释历史触发结果，不能作为买回当日可直接使用的预测信号。</div></div>
          <div class="panel span-12"><div class="toolbar"><h2>实际触发的提前买回账本</h2><span class="tag">${earlyCloseLabel(earlyCloseSummary())}</span></div>${earlyCloseTriggerTable(records)}</div>
        </div>`;
      earlyCloseTimeline("earlyCloseTimeline", records);
      renderEarlyClosePathDiagnostics(records);
      byId("earlyCloseClearSelection").addEventListener("click", () => {
        state.earlyclose.selectedCycleIds = [];
        state.earlyclose.activeCycleId = null;
        earlyCloseTimeline("earlyCloseTimeline", records);
        renderEarlyClosePathDiagnostics(records);
      });
      byId("earlyCloseRule").addEventListener("change", event => { state.earlyclose.rule = event.target.value; state.earlyclose.threshold = null; state.earlyclose.selectedCycleIds = null; state.earlyclose.activeCycleId = null; render(); });
      const thresholdSelect = byId("earlyCloseThreshold");
      if (thresholdSelect) thresholdSelect.addEventListener("change", event => { state.earlyclose.threshold = Number(event.target.value); state.earlyclose.selectedCycleIds = null; state.earlyclose.activeCycleId = null; render(); });
    }

    function renderKpis() {
      const allRecords = currentLedger();
      if (state.tab === "earlyclose") {
        byId("kpis").innerHTML = earlyCloseKpis();
        return;
      }
      if (state.tab === "timing") {
        byId("kpis").innerHTML = timingKpis(timingScenario(allRecords));
        return;
      }
      if (state.tab === "postdiag") {
        byId("kpis").innerHTML = postDiagnosisKpis(postDiagnosisRecords(allRecords));
        return;
      }
      if (state.tab === "path") {
        const records = validPathRecords(allRecords);
        byId("kpis").innerHTML = records.length ? pathKpis(records) : `<div class="panel span-12"><div class="empty">暂无完整的持有期路径数据。</div></div>`;
        return;
      }
      if (state.tab === "cycles") {
        syncSelectedCycles(allRecords);
        const focused = activeSelectedCycle(allRecords);
        const selectedCount = selectedCycleLedger(allRecords).length;
        if (!focused) {
          byId("kpis").innerHTML = `<div class="panel span-12"><div class="empty">请从逐期账本左侧选择一个交易周期。</div></div>`;
          return;
        }
        const focusNote = selectedCount > 1 ? `当前查看周期；已选 ${selectedCount} 期` : "当前查看周期";
        const settlementDate = focused.expiry_date || focused.period_end_date || "--";
        const settlementLabel = focused.assignment_flag ? "行权日 ETF 收盘" : "到期日 ETF 收盘";
        const premiumNote = `总权利金 ${pct(focused.gross_premium_yield)}（内在价值 ${pct(openingIntrinsicYield(focused))}）；开仓时间价值 ${pct(optionTimeValueYield(focused))}`;
        byId("kpis").innerHTML = [
          kpi("开仓 ETF 收盘", price(focused.underlying_price_at_entry), `${focused.rebalance_date || "--"}；${focusNote}`),
          kpi(settlementLabel, price(focused.underlying_price_at_expiry ?? focused.underlying_price_at_period_end), `${settlementDate}；${focused.assignment_flag ? "发生行权" : "未行权"}`),
          kpi("卖出认购期权", focused.option_code || "--", `行权价 ${price(focused.strike)}；期初 Delta ${pct(focused.selected_delta)}`),
          kpi("收到总权利金", cash(focused.gross_premium_cash), premiumNote, "positive")
        ].join("");
        return;
      }
      const records = state.tab === "cash" ? includedCycleLedger(allRecords) : allRecords;
      const stats = cycleStatistics(records);
      const removed = Math.max(allRecords.length - records.length, 0);
      const context = removed ? `剔除 ${removed} 期后，保留 ${records.length} 期` : `全样本、${records.length} 个周期`;
      const strategy = stats.strategy_net_pnl_cash_total;
      byId("kpis").innerHTML = [

    function chartDomain(values, minimumPadding = 0.004) {
      let min = Math.min(0, ...values);
      let max = Math.max(0, ...values);
      const padding = Math.max((max - min) * 0.10, minimumPadding);
      min -= padding;
      max += padding;
      return { min, max };

      const selected = selectedCycleIndex(records);
      const selectedItem = series.find(item => item.index === selected);
      const selectedBand = selectedItem ? `<rect x="${left + series.indexOf(selectedItem) * band}" y="${top}" width="${band}" height="${height - top - bottom}" fill="#dcecf5" pointer-events="none"></rect>` : "";
      const rect = (x, value, fill, detail) => {
        const y = Math.min(zero, sy(value));
        return `<rect x="${x - bar / 2}" y="${y}" width="${bar}" height="${Math.max(1, Math.abs(sy(value) - zero))}" fill="${fill}" ${chartMark(detail)}>${svgTitle(detail)}</rect>`;
      };
      const bars = series.map(({ row }, index) => {
        const center = left + index * band + band / 2;
        const detail = cycleDetail(row, "期权腿现金流");
        return `${rect(center - bar * 0.62, netPremiumYield(row), colors.net, detail)}${rect(center + bar * 0.62, -(num(row.exercise_or_close_cost_yield) || 0), colors.negative, detail)}`;
      }).join("");
      const zones = series.map(({ index: sourceIndex }, index) => `<rect class="period-hit" data-cycle-index="${sourceIndex}" x="${left + index * band}" y="${top}" width="${band}" height="${height - top - bottom}" fill="transparent" style="cursor:pointer"></rect>`).join("");
      const ticks = [0, Math.floor(series.length / 2), series.length - 1].filter((value, index, arr) => arr.indexOf(value) === index).map(index => `<text x="${left + index * band + band / 2}" y="${height - 13}" text-anchor="middle" font-size="10" fill="#5e6a79">${esc(String(series[index].row.rebalance_date).slice(0, 7))}</text>`).join("");
      el.innerHTML = `<svg viewBox="0 0 ${width} ${height}" role="img" aria-label="每期权利金净收入与行权截断成本"><line x1="${left}" x2="${width - right}" y1="${zero}" y2="${zero}" stroke="#9eabb5"/>${selectedBand}${bars}${zones}<text x="5" y="${top + 4}" font-size="10" fill="#5e6a79">${pct(max)}</text><text x="5" y="${height - bottom}" font-size="10" fill="#5e6a79">${pct(min)}</text>${ticks}</svg><div class="legend"><span><i style="background:${colors.net}"></i>权利金净收入（扣摩擦）</span><span><i style="background:${colors.negative}"></i>行权/平仓截断成本</span></div>`;
      bindCycleBarEvents(el, records);
    }

    function strategyReturnTimeline(id, records, highlightedCycleIds = null) {
      const el = byId(id);
      const series = records.map((row, index) => ({ row, index })).filter(item => num(item.row.etf_period_return) !== null && num(strategyNetRate(item.row)) !== null);
      if (!el || !series.length) return;

      const width = 860, height = 250, left = 44, right = 14, top = 14, bottom = 46;
      const values = series.flatMap(({ row }) => [num(row.etf_period_return) || 0, strategyNetRate(row)]);
      const { min, max } = chartDomain(values);
      const sy = value => scale(value, min, max, height - bottom, top);
      const zero = sy(0), band = (width - left - right) / series.length;
      const bar = Math.max(2.5, Math.min(11, band * 0.28));
      const highlighted = Array.isArray(highlightedCycleIds) ? new Set(highlightedCycleIds) : null;
      const selected = selectedCycleIndex(records);
      const selectedItem = series.find(item => item.index === selected);
      const selectedBands = highlighted
        ? series.map(({ row, index: sourceIndex }, index) => highlighted.has(cycleKey(row, sourceIndex)) ? `<rect x="${left + index * band}" y="${top}" width="${band}" height="${height - top - bottom}" fill="#dcecf5" pointer-events="none"></rect>` : "").join("")
        : (selectedItem ? `<rect x="${left + series.indexOf(selectedItem) * band}" y="${top}" width="${band}" height="${height - top - bottom}" fill="#dcecf5" pointer-events="none"></rect>` : "");
      const pairedBars = series.map(({ row }, index) => {
        const etfValue = num(row.etf_period_return) || 0;
        const strategyValue = strategyNetRate(row) || 0;
        const x = left + index * band + band / 2;
        const etfY = Math.min(zero, sy(etfValue));
        const strategyY = Math.min(zero, sy(strategyValue));
        const detail = cycleDetail(row, "ETF 与策略当期收益");
        return `<rect x="${x - bar * 1.15}" y="${etfY}" width="${bar}" height="${Math.max(1, Math.abs(sy(etfValue) - zero))}" fill="#9ba8b1" ${chartMark(detail)}>${svgTitle(detail)}</rect><rect x="${x + bar * 0.15}" y="${strategyY}" width="${bar}" height="${Math.max(1, Math.abs(sy(strategyValue) - zero))}" fill="#18212f" ${chartMark(detail)}>${svgTitle(detail)}</rect>`;
      }).join("");
      const zones = series.map(({ index: sourceIndex }, index) => `<rect class="period-hit" data-cycle-index="${sourceIndex}" x="${left + index * band}" y="${top}" width="${band}" height="${height - top - bottom}" fill="transparent" style="cursor:pointer"></rect>`).join("");
      const ticks = [0, Math.floor(series.length / 2), series.length - 1].filter((value, index, arr) => arr.indexOf(value) === index).map(index => `<text x="${left + index * band + band / 2}" y="${height - 13}" text-anchor="middle" font-size="10" fill="#5e6a79">${esc(String(series[index].row.rebalance_date).slice(0, 7))}</text>`).join("");
      el.innerHTML = `<svg viewBox="0 0 ${width} ${height}" role="img" aria-label="ETF当期收益与备兑策略当期净收益"><line x1="${left}" x2="${width - right}" y1="${zero}" y2="${zero}" stroke="#9eabb5"/>${selectedBands}${pairedBars}${zones}<text x="5" y="${top + 4}" font-size="10" fill="#5e6a79">${pct(max)}</text><text x="5" y="${height - bottom}" font-size="10" fill="#5e6a79">${pct(min)}</text>${ticks}</svg><div class="legend"><span><i style="background:#9ba8b1"></i>ETF 当期收益</span><span><i style="background:#18212f"></i>策略当期净收益</span>${highlighted ? `<span><i style="background:#dcecf5"></i>左侧已选周期</span>` : ""}</div>`;
      bindCycleBarEvents(el, records);
    }

    function selectCycle(records, index) {
      if (!records.length) return;
      const next = Math.max(0, Math.min(records.length - 1, Number.isFinite(index) ? Math.trunc(index) : 0));
      if (state.selectedCycleIndex === next) return;
      state.selectedCycleIndex = next;
      renderSelectedCycleDetail(records);
      if (byId("cashBars")) groupedBars("cashBars", records);
      if (byId("strategyReturnTimeline")) strategyReturnTimeline("strategyReturnTimeline", records);
      if (byId("ivRvStrip")) ivRvStrip("ivRvStrip", records);
      if (byId("assignmentTimeline")) assignmentTimeline("assignmentTimeline", records);
      if (byId("premiumScatter")) premiumScatter("premiumScatter", records);
      if (byId("ivRvPremiumScatter")) ivRvScatter("ivRvPremiumScatter", records, "premium");
      if (byId("ivRvNetOptionScatter")) ivRvScatter("ivRvNetOptionScatter", records, "netOption");
    }

    function calendarMonthKey(value) {
      return String(value || "").slice(0, 7);
    }

    function shiftCalendarMonth(monthKey, offset) {
      const [year, month] = String(monthKey || "").split("-").map(Number);
      const date = new Date(year, month - 1 + offset, 1);
      return `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, "0")}`;
    }

    function renderExclusionControls(records) {
      const root = byId("calendarControl");
      const summary = byId("exclusionSummary");
      if (!root || !summary) return;

      const knownKeys = new Set(records.map((row, index) => cycleKey(row, index)));
      state.excludedCycleIds = (state.excludedCycleIds || []).filter(key => knownKeys.has(key));

      const cyclesByDate = new Map();
      records.forEach((row, index) => {
        const date = String(row.rebalance_date || "").slice(0, 10);
        if (!date) return;
        const cycles = cyclesByDate.get(date) || [];
        cycles.push({ key: cycleKey(row, index) });
        cyclesByDate.set(date, cycles);
      });

      const months = [...new Set([...cyclesByDate.keys()].map(calendarMonthKey))].sort();
      if (!months.includes(state.calendarMonth)) state.calendarMonth = months[months.length - 1] || null;
      if (!state.calendarMonth) {
        root.innerHTML = `<div class="empty">暂无可选周期。</div>`;
        summary.innerHTML = exclusionSummaryTable(records, includedCycleLedger(records));
        return;
      }

      const [year, month] = state.calendarMonth.split("-").map(Number);
      const firstWeekday = new Date(year, month - 1, 1).getDay();
      const daysInMonth = new Date(year, month, 0).getDate();
      const selected = new Set(state.excludedCycleIds);
      const cells = Array.from({ length: 42 }, (_, index) => {
        const day = index - firstWeekday + 1;
        if (day < 1 || day > daysInMonth) return `<span class="calendar-day" aria-hidden="true"></span>`;
        const date = `${state.calendarMonth}-${String(day).padStart(2, "0")}`;
        const cycles = cyclesByDate.get(date) || [];
        if (!cycles.length) return `<span class="calendar-day">${day}</span>`;
        const isExcluded = cycles.some(cycle => selected.has(cycle.key));
        const cycleKeyForDay = cycles[0].key;
        return `<button type="button" class="calendar-day${isExcluded ? " is-excluded" : ""}" data-exclude-cycle="${esc(cycleKeyForDay)}" aria-pressed="${isExcluded}" title="${esc(`${date} 开仓周期`)}">${day}<span class="calendar-dot" aria-hidden="true"></span></button>`;
      }).join("");

      root.innerHTML = `<div class="calendar-shell"><div class="calendar-toolbar"><button type="button" class="calendar-nav" id="calendarPrev" aria-label="上一个月">&#8592;</button><select id="calendarMonthSelect" aria-label="选择月份">${months.map(key => `<option value="${esc(key)}"${key === state.calendarMonth ? " selected" : ""}>${esc(key)}</option>`).join("")}</select><button type="button" class="calendar-nav" id="calendarNext" aria-label="下一个月">&#8594;</button></div><div class="calendar-weekdays"><span>日</span><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span></div><div class="calendar-days">${cells}</div></div>`;

      root.querySelectorAll("[data-exclude-cycle]").forEach(button => button.addEventListener("click", () => {
        const key = button.dataset.excludeCycle;
        const next = new Set(state.excludedCycleIds);
        next.has(key) ? next.delete(key) : next.add(key);
        state.excludedCycleIds = [...next];
        state.selectedCycleIndex = 0;
        render();
      }));
      byId("calendarMonthSelect").addEventListener("change", event => {
        state.calendarMonth = event.target.value;
        renderExclusionControls(records);
      });
      byId("calendarPrev").addEventListener("click", () => {
        const previous = shiftCalendarMonth(state.calendarMonth, -1);
        if (months.includes(previous)) {
          state.calendarMonth = previous;
          renderExclusionControls(records);
        }
      });
      byId("calendarNext").addEventListener("click", () => {
        const next = shiftCalendarMonth(state.calendarMonth, 1);
        if (months.includes(next)) {
          state.calendarMonth = next;
          renderExclusionControls(records);
        }
      });
      const clear = byId("clearExcludedCycles");
      if (clear) clear.addEventListener("click", () => {
        state.excludedCycleIds = [];
        state.selectedCycleIndex = 0;
        render();
      });
      summary.innerHTML = exclusionSummaryTable(records, includedCycleLedger(records));
    }

    function init() {
      if (!rows(DATA.etfs).length) { byId("content").innerHTML = `<div class="empty">尚未找到 ver4.0 数据。请先运行单ETF实验并构建看板数据包。</div>`; return; }
      populateSelectors(); updateSideInfo();
      byId("etfSelect").addEventListener("change", event => { state.etf = event.target.value; state.strategy = null; state.selectedCycleIndex = 0; state.selectedCycleIds = null; state.activeCycleId = null; state.excludedCycleIds = []; state.calendarMonth = null; state.earlyclose.selectedCycleIds = null; state.earlyclose.activeCycleId = null; populateSelectors(); updateSideInfo(); render(); });
      byId("strategySelect").addEventListener("change", event => { state.strategy = event.target.value; state.selectedCycleIndex = 0; state.selectedCycleIds = null; state.activeCycleId = null; state.excludedCycleIds = []; state.calendarMonth = null; state.earlyclose.selectedCycleIds = null; state.earlyclose.activeCycleId = null; render(); });
      document.querySelectorAll("[data-tab]").forEach(button => button.addEventListener("click", () => { state.tab = button.dataset.tab; document.querySelectorAll("[data-tab]").forEach(item => item.classList.toggle("active", item === button)); render(); }));
      render();
    }
    init();
  </script>
</body>
</html>
