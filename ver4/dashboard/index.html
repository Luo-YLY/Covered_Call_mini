<!doctype html>
<html lang="zh-CN">
<head>

  <title>单ETF备兑周期现金流看板</title>
  <script src="../../outputs/ver4_0_single_etf_cycle_cashflow/dashboard/ver4_dashboard_data.js?v=early-path-20260716"></script>
  <style>
    :root {

    .app { display: grid; grid-template-columns: 248px minmax(0, 1fr); min-height: 100vh; }

    .tabs button.active { border-color: #b9d9d8; background: #edf7f7; color: #174148; font-weight: 700; }
    .side-note { margin-top: 17px; padding-top: 13px; border-top: 1px solid #536775; color: #c9d4db; font-size: 12px; line-height: 1.65; }
    .top { display: flex; justify-content: space-between; gap: 16px; align-items: flex-start; margin-bottom: 16px; }
    .tag { display: inline-flex; align-items: center; min-height: 24px; padding: 2px 7px; border: 1px solid #cbd8df; border-radius: 6px; background: #fff; color: #4d5c69; font-size: 12px; white-space: nowrap; }
    .tag.warn { border-color: #e5c997; background: #fff9ed; color: #7a5616; }
    .grid { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 12px; margin-bottom: 12px; align-items: start; }
    .panel { min-width: 0; padding: 14px; border: 1px solid var(--line); border-radius: 7px; background: var(--surface); box-shadow: var(--shadow); }
    .span-3 { grid-column: span 3; } .span-4 { grid-column: span 4; } .span-5 { grid-column: span 5; } .span-6 { grid-column: span 6; } .span-7 { grid-column: span 7; } .span-8 { grid-column: span 8; } .span-12 { grid-column: span 12; } .span-row-2 { grid-row: span 2; }
    .metric { font-size: 23px; font-weight: 700; letter-spacing: 0; }
    .metric small { display: block; margin-top: 3px; color: var(--muted); font-size: 11px; font-weight: 400; }
    .metric.positive { color: var(--green); } .metric.negative { color: var(--red); }
    .toolbar { display: flex; justify-content: space-between; gap: 10px; align-items: center; flex-wrap: wrap; }
    .toolbar h2 { margin-bottom: 0; }
    .note { margin: 9px 0 0; padding: 8px 10px; border-left: 3px solid #6b8998; background: #f1f5f7; color: #50606c; font-size: 12px; }
    .chart { position: relative; min-height: 250px; margin-top: 8px; }
    .chart svg { width: 100%; height: auto; display: block; overflow: visible; }
    .chart [data-detail] { cursor: pointer; }
    .chart [data-detail]:focus { outline: none; filter: brightness(0.82); }
    .legend { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 4px; color: var(--muted); font-size: 12px; }
    .legend i { display: inline-block; width: 9px; height: 9px; margin-right: 4px; border-radius: 50%; vertical-align: 0; }
    .chart-footer { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 6px 14px; margin-top: 5px; }
    .chart-footer .legend { margin-top: 0; }
    .chart-stat { color: var(--muted); font-size: 12px; white-space: nowrap; }
    .table-wrap { overflow: auto; border: 1px solid var(--line); border-radius: 6px; }
    table { width: 100%; min-width: 920px; border-collapse: collapse; background: #fff; }
    th, td { padding: 8px 9px; border-bottom: 1px solid #e4eaee; text-align: right; vertical-align: top; white-space: nowrap; }
    th { background: #f0f4f6; color: #394c5a; font-weight: 700; }
    th:first-child, td:first-child, .left { text-align: left; }
    tr:last-child td { border-bottom: 0; }
    .empty { padding: 28px 12px; border: 1px dashed var(--line); border-radius: 6px; color: var(--muted); text-align: center; }
    .muted { color: var(--muted); }
    .period-control { display: flex; align-items: center; justify-content: flex-end; gap: 8px; margin-top: 8px; }
    .period-control label { margin: 0; color: var(--muted); font-size: 12px; font-weight: 700; }
    .period-control select { width: 176px; min-height: 30px; padding: 4px 8px; border: 1px solid var(--line); border-radius: 4px; background: #fff; color: var(--ink); font-family: inherit; font-size: 12px; }
    .cycle-detail { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px 18px; margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--line); }
    .cycle-detail-item { min-width: 0; }
    .cycle-detail-item span, .cycle-detail-item strong { display: block; }
    .cycle-detail-item span { color: var(--muted); font-size: 11px; }
    .cycle-detail-item strong { margin-top: 2px; color: var(--ink); font-size: 13px; font-weight: 800; }
    .cycle-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 10px; }
    .cycle-actions button { min-height: 30px; padding: 0 10px; border: 1px solid #8fa2ad; border-radius: 4px; background: #fff; color: #334956; font: inherit; cursor: pointer; }
    .selection-toolbar-actions { display: flex; align-items: center; gap: 8px; }
    .selection-toolbar-actions button { min-height: 30px; padding: 0 10px; border: 1px solid #8fa2ad; border-radius: 4px; background: #fff; color: #334956; font: inherit; cursor: pointer; }
    .cycle-checklist { max-height: 540px; overflow: auto; border-top: 1px solid var(--line); }
    .cycle-check { display: grid; grid-template-columns: 18px minmax(0, 1fr); gap: 8px; align-items: start; padding: 10px 2px; border-bottom: 1px solid var(--line); cursor: pointer; }
    .cycle-check input { width: 15px; height: 15px; margin: 2px 0 0; accent-color: var(--blue); cursor: pointer; }
    .cycle-check strong, .cycle-check span { display: block; }
    .cycle-check strong { color: var(--ink); font-size: 13px; }
    .cycle-check span { margin-top: 2px; color: var(--muted); font-size: 12px; }
    .selection-metrics { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px 16px; margin: 6px 0 12px; }
    .selection-metrics div { min-width: 0; padding-bottom: 8px; border-bottom: 1px solid var(--line); }
    .selection-metrics span, .selection-metrics strong { display: block; }
    .selection-metrics span { color: var(--muted); font-size: 12px; }
    .selection-metrics strong { margin-top: 2px; font-size: 16px; }
    .exclusion-control { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; align-items: end; }
    .exclusion-control label { margin: 0 0 6px; color: var(--muted); font-size: 12px; font-weight: 700; }
    .exclusion-control select { width: 100%; height: 92px; padding: 6px 8px; border: 1px solid var(--line); border-radius: 4px; background: #fff; color: var(--ink); font: inherit; }
    .exclusion-control button { height: 32px; padding: 0 10px; border: 1px solid #8fa2ad; border-radius: 4px; background: #fff; color: #334956; font: inherit; cursor: pointer; }
    .calendar-shell { min-width: 0; }
    .calendar-toolbar { display: flex; align-items: center; gap: 7px; margin-bottom: 8px; }
    .calendar-toolbar select { width: 156px; height: 32px; padding: 0 8px; border: 1px solid var(--line); border-radius: 4px; background: #fff; color: var(--ink); font: inherit; }
    .calendar-nav { width: 32px; height: 32px; padding: 0; border: 1px solid #8fa2ad; border-radius: 4px; background: #fff; color: #334956; font: 18px/1 Arial, sans-serif; cursor: pointer; }
    .calendar-weekdays, .calendar-days { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }
    .calendar-weekdays { margin-bottom: 4px; }
    .calendar-weekdays span { color: var(--muted); font-size: 11px; text-align: center; }
    .calendar-day { position: relative; display: flex; align-items: center; justify-content: center; min-height: 31px; color: #7b8993; font-size: 12px; }
    button.calendar-day { border: 1px solid #d8e0e8; border-radius: 4px; background: #fff; color: var(--ink); font: inherit; cursor: pointer; }
    button.calendar-day:hover { background: #eef5f7; }
    button.calendar-day.is-excluded { border-color: #b5413b; background: #fff0ef; color: #8d2f2a; font-weight: 700; }
    .calendar-dot { position: absolute; bottom: 3px; width: 4px; height: 4px; border-radius: 50%; background: var(--blue); }
    button.calendar-day.is-excluded .calendar-dot { background: var(--red); }
    .subchart-heading { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--line); }
    .subchart-heading h3 { margin: 0; color: var(--ink); font-size: 13px; }
    .subchart-heading.first-chart { margin-top: 8px; padding-top: 8px; }
    .assignment-chart { min-height: 112px; margin-top: 6px; }
    .daily-path-price-chart { min-height: 158px; margin-top: 6px; }
    .attribution-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px; margin-top: 10px; }
    .attribution-grid h3 { margin: 0 0 5px; color: var(--ink); font-size: 13px; }
    .attribution-table { margin-top: 14px; }
    .iv-rv-chart { min-height: 126px; margin-top: 6px; }
    .timing-controls { display: grid; gap: 12px; }
    .timing-toggle { display: grid; grid-template-columns: 18px minmax(0, 1fr); gap: 8px; align-items: start; color: var(--ink); cursor: pointer; }
    .timing-toggle input { width: 15px; height: 15px; margin: 2px 0 0; accent-color: var(--blue); cursor: pointer; }
    .timing-toggle strong, .timing-toggle span { display: block; }
    .timing-toggle strong { font-size: 13px; }
    .timing-toggle span { margin-top: 2px; color: var(--muted); font-size: 12px; line-height: 1.45; }
    .timing-field { display: grid; grid-template-columns: 1fr 108px; gap: 8px; align-items: center; margin: 7px 0 0 26px; }
    .timing-field label { margin: 0; color: var(--muted); font-size: 12px; font-weight: 700; }
    .timing-field select { width: 100%; height: 30px; padding: 0 7px; border: 1px solid var(--line); border-radius: 4px; background: #fff; color: var(--ink); font: inherit; }
    .timing-field.is-disabled { opacity: .48; }
    .timing-summary { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px 18px; }
    .timing-summary div { padding: 8px 0; border-bottom: 1px solid var(--line); }
    .timing-summary span, .timing-summary strong { display: block; }
    .timing-summary span { color: var(--muted); font-size: 12px; }
    .timing-summary strong { margin-top: 3px; color: var(--ink); font-size: 18px; }
    .diagnostic-toggle { display: inline-flex; align-items: center; gap: 7px; margin: 0; color: var(--ink); font-size: 12px; font-weight: 700; cursor: pointer; }
    .diagnostic-toggle input { width: 15px; height: 15px; margin: 0; accent-color: var(--blue); cursor: pointer; }
    .decision-yes { color: var(--green); font-weight: 800; }
    .decision-no { color: var(--red); font-weight: 800; }
    .timing-ledger-wrap, .path-ledger-wrap { max-height: 520px; overflow: auto; }
    .timing-ledger-wrap thead th, .path-ledger-wrap thead th { position: sticky; top: 0; z-index: 2; box-shadow: 0 1px 0 #cfd9df; }
    @media (max-width: 920px) {
      .app { grid-template-columns: 1fr; }
      aside { position: static; height: auto; }
      .tabs { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .span-3, .span-4, .span-5, .span-6, .span-7, .span-8, .span-12 { grid-column: span 12; }
      .span-row-2 { grid-row: auto; }
      main { padding: 15px; }
      .top { flex-direction: column; }
      .cycle-detail, .selection-metrics { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .attribution-grid { grid-template-columns: 1fr; }
      .exclusion-control { grid-template-columns: 1fr; }
      .exclusion-control button { width: 100%; }
    }
  </style>
</head>
<body>
  <div class="app">
    <aside>
      <div class="brand">
        <div class="brand-title">单ETF备兑周期现金流</div>
        <div class="brand-copy">固定名义本金、逐期独立结算。展示每一期收取的权利金、最终净收益与上涨让渡。</div>
      </div>
      <label for="etfSelect">ETF 标的</label>
      <select id="etfSelect"></select>
      <label for="strategySelect">备兑规则</label>
      <select id="strategySelect"></select>
      <nav class="tabs" aria-label="周期现金流页面">
        <button class="active" data-tab="cash">现金收入</button>
        <button data-tab="cycles">逐期账本</button>
        <button data-tab="postdiag">事后诊断</button>
        <button data-tab="tradeoff">上涨让渡</button>
        <button data-tab="path">持有期路径</button>
        <button data-tab="regime">市场情景</button>
        <button data-tab="timing">择时分析</button>
        <button data-tab="earlyclose">提前平仓</button>
      </nav>
      <div class="side-note">
        <div>样本：<span id="sampleText">--</span></div>
        <div>每期名义本金：<span id="notionalText">--</span></div>
        <div>数据生成：<span id="generatedText">--</span></div>
      </div>
    </aside>
    <main>
      <div class="top">
        <div>
          <h1 id="pageTitle">现金收入</h1>
          <p id="pageLead">开仓收到的权利金与最终期权净收益必须分开观察。</p>
        </div>
        <span class="tag warn">历史回测，不构成收益承诺</span>
      </div>
      <section id="kpis" class="grid"></section>
      <section id="content"></section>
    </main>
  </div>
  <script>
    const DATA = window.VER4_DASHBOARD_DATA || {};
    const state = { etf: null, strategy: null, tab: "cash", selectedCycleIndex: 0, selectedCycleIds: null, activeCycleId: null, excludedCycleIds: [], calendarMonth: null, timing: { useIvPercentile: false, ivLookback: 12, ivPercentileThreshold: 0.70, useIvRv: false, ivRvThreshold: 0 }, postdiag: { exclude924: false }, earlyclose: { rule: "delta", threshold: 0.70, selectedCycleIds: null, activeCycleId: null } };
    const earlyCloseDailyCache = {};
    const earlyCloseDailyRequests = {};
    const tabs = {
      cash: ["现金收入", "每个周期先看收取了多少权利金，再看扣除行权、平仓与交易摩擦后的净期权收益。"],
      cycles: ["逐期账本", "每一期都以相同名义本金重置；上一期盈亏不会放大或缩小下一期。"],
      postdiag: ["事后诊断", "用开仓 IV-RV 与持有期结束后才可得的实际波动率，检验历史上是否出现方差溢价；该页面明确使用未来信息。"],
      tradeoff: ["上涨让渡", "横轴是 ETF 当期涨跌，纵轴是备兑相对裸持的贡献；强上涨中可能出现明确的机会成本。"],
      path: ["持有期路径", "以开仓后最大上涨、最大下跌和实际振幅解释每期结果。它们均为事后归因标签，不参与开仓或择时决策。"],
      regime: ["市场情景", "市场环境为事后归因标签，不参与开仓决策或参数选择。"],
      timing: ["择时分析", "手动设置开仓 IV 分位与 IV-RV 条件，模拟满足条件时卖出、否则仅持有 ETF 的逐期结果。当前为收盘数据的探索性诊断，不代表可成交择时回测。"],
      earlyclose: ["提前平仓", "Delta 达阈值后买回原卖出期权、后续不重开，检验减少行权是否值得付出提前平仓的成本。"]
    };
    const colors = { premium: "#1565c0", net: "#167353", negative: "#b5413b", relative: "#9a6718", baseline: "#677684" };

    function num(value) { const n = Number(value); return Number.isFinite(n) ? n : null; }
    function pct(value, digits = 2) { const n = num(value); return n === null ? "--" : `${(n * 100).toFixed(digits)}%`; }
    function variancePoints(value, digits = 0) { const n = num(value); return n === null ? "--" : `${n >= 0 ? "+" : "-"}${Math.abs(n * 10000).toFixed(digits)} 方差点`; }
    function cash(value, digits = 2) { const n = num(value); return n === null ? "--" : `${n >= 0 ? "" : "-"}${Math.abs(n).toFixed(digits)}`; }
    function fmt(value, digits = 2) { const n = num(value); return n === null ? "--" : n.toFixed(digits); }
    function price(value) { return fmt(value, 3); }
    function esc(value) { return String(value ?? "").replace(/[&<>'"]/g, char => ({"&":"&amp;","<":"&lt;",">":"&gt;","'":"&#39;","\"":"&quot;"}[char])); }
    function rows(value) { return Array.isArray(value) ? value : []; }
    function byId(id) { return document.getElementById(id); }
    function currentEtf() { return rows(DATA.etfs).find(item => item.etf_code === state.etf) || rows(DATA.etfs)[0] || null; }
    function currentSummary() { return rows(currentEtf()?.summary).find(row => row.strategy_name === state.strategy) || {}; }
    function currentLedger() { return rows(currentEtf()?.ledger).filter(row => row.strategy_name === state.strategy).sort((a, b) => String(a.rebalance_date).localeCompare(String(b.rebalance_date))); }
    function currentRolling() { return rows(currentEtf()?.rolling_cashflow).filter(row => row.strategy_name === state.strategy).sort((a, b) => String(a.window_end).localeCompare(String(b.window_end))); }
    function currentRegime() { return rows(currentEtf()?.regime).filter(row => row.strategy_name === state.strategy); }
    function labelStrategy(row) { return row.strategy_label || row.strategy_name; }
    function kpi(title, value, note, cls = "") { return `<div class="panel span-3"><h3>${esc(title)}</h3><div class="metric ${esc(cls)}">${esc(value)}<small>${esc(note)}</small></div></div>`; }

    function populateSelectors() {
      const etfs = rows(DATA.etfs);
      if (!etfs.length) return;
      if (!state.etf || !etfs.some(item => item.etf_code === state.etf)) state.etf = etfs.find(item => item.etf_code === "510300")?.etf_code || etfs[0].etf_code;
      byId("etfSelect").innerHTML = etfs.map(item => `<option value="${esc(item.etf_code)}">${esc(item.etf_code)}</option>`).join("");
      byId("etfSelect").value = state.etf;
      // Buy-and-hold remains the comparison anchor inside every covered-call view;
      // it is intentionally not rendered as an option-income strategy.
      const summary = rows(currentEtf()?.summary).filter(row => row.parameter_role !== "buyhold");
      const ordered = [...summary].sort((a, b) => {
        const aAtm = a.parameter_role === "static_atm_coverage" ? 0 : a.parameter_role === "static_target_delta_coverage" ? 1 : 2;
        const bAtm = b.parameter_role === "static_atm_coverage" ? 0 : b.parameter_role === "static_target_delta_coverage" ? 1 : 2;
        return aAtm - bAtm || (num(a.target_delta) || 9) - (num(b.target_delta) || 9);
      });
      if (!state.strategy || !ordered.some(row => row.strategy_name === state.strategy)) {
        state.strategy = ordered.find(row => row.parameter_role === "static_atm_coverage")?.strategy_name || ordered[0]?.strategy_name || "";
      }
      byId("strategySelect").innerHTML = ordered.map(row => `<option value="${esc(row.strategy_name)}">${esc(labelStrategy(row))}</option>`).join("");
      byId("strategySelect").value = state.strategy;
    }

    function updateSideInfo() {
      const etf = currentEtf();
      const manifest = etf?.manifest || {};
      const sample = manifest.etf || {};
      byId("sampleText").textContent = sample.sample_start && sample.sample_end ? `${sample.sample_start} 至 ${sample.sample_end}` : "--";
      byId("notionalText").textContent = num(manifest.fixed_notional) === null ? "--" : fmt(manifest.fixed_notional, 0);
      byId("generatedText").textContent = DATA.generated_at || "--";
    }

    function renderKpis() {
      const summary = currentSummary();
      const net = num(summary.net_option_pnl_cash_total) || 0;
      byId("kpis").innerHTML = [
        kpi("净期权收益", cash(summary.net_option_pnl_cash_total), "全样本、固定名义本金累计", net >= 0 ? "positive" : "negative"),
        kpi("单期净收益中位数", pct(summary.net_option_yield_median), "扣除行权/平仓与成本后", (num(summary.net_option_yield_median) || 0) >= 0 ? "positive" : "negative"),
        kpi("期权腿为正比例", pct(summary.positive_net_option_cycle_rate), `${fmt(summary.cycle_count, 0)} 个周期`, ""),
        kpi("12期现金收入中位数", pct(summary.rolling_net_option_yield_median), "非复利滚动12期", (num(summary.rolling_net_option_yield_median) || 0) >= 0 ? "positive" : "negative")
      ].join("");
    }

    function render() {
      const [title, lead] = tabs[state.tab];
      byId("pageTitle").textContent = title;
      byId("pageLead").textContent = lead;
      renderKpis();
      if (state.tab === "cash") renderCash();
      if (state.tab === "cycles") renderCycles();
      if (state.tab === "postdiag") renderPostDiagnosis();
      if (state.tab === "tradeoff") renderTradeoff();

    function median(values) {
      const valid = values.filter(value => num(value) !== null).map(Number).sort((a, b) => a - b);
      if (!valid.length) return null;
      const middle = Math.floor(valid.length / 2);
      return valid.length % 2 ? valid[middle] : (valid[middle - 1] + valid[middle]) / 2;
    }

    function pearson(xValues, yValues) {
      if (xValues.length < 3 || xValues.length !== yValues.length) return null;
      const xMean = xValues.reduce((total, value) => total + value, 0) / xValues.length;
      const yMean = yValues.reduce((total, value) => total + value, 0) / yValues.length;
      let numerator = 0, xSquare = 0, ySquare = 0;
      xValues.forEach((value, index) => {
        const x = value - xMean, y = yValues[index] - yMean;
        numerator += x * y; xSquare += x * x; ySquare += y * y;
      });
      return xSquare > 0 && ySquare > 0 ? numerator / Math.sqrt(xSquare * ySquare) : null;
    }

    function rank(values) {
      const positions = values.map((value, index) => ({ value, index })).sort((a, b) => a.value - b.value);
      const ranks = Array(values.length);
      let start = 0;
      while (start < positions.length) {
        let end = start;
        while (end + 1 < positions.length && positions[end + 1].value === positions[start].value) end += 1;
        const averageRank = (start + end + 2) / 2;
        for (let index = start; index <= end; index += 1) ranks[positions[index].index] = averageRank;
        start = end + 1;
      }
      return ranks;
    }

    function spearman(records, xAccessor, yAccessor) {
      const pairs = records.map(row => ({ x: num(xAccessor(row)), y: num(yAccessor(row)) })).filter(item => item.x !== null && item.y !== null);
      return pearson(rank(pairs.map(item => item.x)), rank(pairs.map(item => item.y)));
    }

    function pathScatter(id, records, options) {

      const xMin = Math.min(0, ...xValues), xMax = Math.max(0, ...xValues), yMin = Math.min(0, ...yValues), yMax = Math.max(0, ...yValues);

        const outcome = options.strategyColor ? item.y : num(item.row.net_option_yield);
        const fill = outcome >= 0 ? colors.net : colors.negative;
        const detail = pathDetail(item.row);
        const mark = chartMark(detail);
        return item.row.assignment_flag
          ? `<rect x="${sx(item.x) - 3.6}" y="${sy(item.y) - 3.6}" width="7.2" height="7.2" fill="${fill}" ${mark}>${svgTitle(detail)}</rect>`

    function percentileRank(history, value) {
      if (!history.length || num(value) === null) return null;
      return history.filter(item => item <= value).length / history.length;
    }

    function timingScenario(records) {
      const settings = state.timing;
      const lookback = Math.max(1, Number(settings.ivLookback) || 12);
      const history = [];
      const enriched = records.map((row, index) => {
        const entryIv = num(row.entry_iv);
        const ivRv = num(row.entry_iv_rv20_spread);
        const past = history.slice(-lookback);
        const ivPercentile = past.length >= lookback ? percentileRank(past, entryIv) : null;
        const ivPass = !settings.useIvPercentile || (ivPercentile !== null && ivPercentile >= Number(settings.ivPercentileThreshold));
        const ivRvPass = !settings.useIvRv || (ivRv !== null && ivRv >= Number(settings.ivRvThreshold));
        const optionAvailable = Boolean(row.option_selected_flag ?? row.option_code);
        const sell = optionAvailable && ivPass && ivRvPass;
        const reasons = [];
        if (!optionAvailable) reasons.push("当期无可用合约");
        if (settings.useIvPercentile && ivPercentile === null) reasons.push("历史IV不足");
        else if (settings.useIvPercentile && !ivPass) reasons.push("IV分位未达标");
        if (settings.useIvRv && ivRv === null) reasons.push("IV-RV缺失");
        else if (settings.useIvRv && !ivRvPass) reasons.push("IV-RV未达标");
        if (entryIv !== null) history.push(entryIv);
        const etfReturn = num(row.etf_period_return) || 0;
        const optionReturn = num(row.net_option_yield) || 0;
        return {
          row, index, ivPercentile, sell, reason: sell ? "满足当前条件" : reasons.join("；") || "不卖出",
          etfReturn, optionReturn,
          alwaysStrategyReturn: num(strategyNetRate(row)) ?? etfReturn + optionReturn,
          timingStrategyReturn: etfReturn + (sell ? optionReturn : 0)
        };
      });
      const sum = (field) => enriched.reduce((total, item) => total + (num(item[field]) || 0), 0);
      const active = enriched.filter(item => item.sell);
      return {
        rows: enriched,
        cycleCount: enriched.length,
        activeCount: active.length,
        optionReturnTotal: sum("optionReturn"),
        timingOptionReturnTotal: active.reduce((total, item) => total + item.optionReturn, 0),
        etfReturnTotal: sum("etfReturn"),
        alwaysStrategyReturnTotal: sum("alwaysStrategyReturn"),
        timingStrategyReturnTotal: sum("timingStrategyReturn"),
        missingSignalCount: enriched.filter(item => !item.sell && /缺失|不足/.test(item.reason)).length
      };
    }

    function timingKpis(scenario) {
      const difference = scenario.timingStrategyReturnTotal - scenario.alwaysStrategyReturnTotal;
      const timingOptionCash = scenario.timingOptionReturnTotal * (num(currentEtf()?.manifest?.fixed_notional) || 100);
      const timingStrategyCash = scenario.timingStrategyReturnTotal * (num(currentEtf()?.manifest?.fixed_notional) || 100);
      return [
        kpi("实际卖出期数", `${scenario.activeCount} / ${scenario.cycleCount}`, "满足当前开关条件的周期", ""),
        kpi("择时后净期权收益", cash(timingOptionCash), "固定名义本金逐期相加；未卖出周期为 0", timingOptionCash >= 0 ? "positive" : "negative"),
        kpi("择时后完整策略结果", cash(timingStrategyCash), "ETF 当期收益 + 仅在卖出期计入的净期权收益", timingStrategyCash >= 0 ? "positive" : "negative"),
        kpi("相对始终卖出差额", pct(difference), "逐期简单相加；正值代表本情景更优", difference >= 0 ? "positive" : "negative")
      ].join("");
    }

      const difference = scenario.timingStrategyReturnTotal - scenario.alwaysStrategyReturnTotal;
      const summary = [

      const sy = value => scale(value, min, max, height - bottom, top);
      const zero = sy(0), band = (width - left - right) / series.length;
      const bar = Math.max(2.5, Math.min(9, band * .18));
      const timingEnabled = state.timing.useIvPercentile || state.timing.useIvRv;
      const skippedBands = timingEnabled ? series.map((item, index) => item.sell ? "" : `<rect x="${left + index * band}" y="${top}" width="${band}" height="${height - top - bottom}" fill="#d9e0e5" opacity="0.72" pointer-events="none"></rect>`).join("") : "";
      const rect = (x, value, fill, detail) => `<rect x="${x - bar / 2}" y="${Math.min(zero, sy(value))}" width="${bar}" height="${Math.max(1, Math.abs(sy(value) - zero))}" fill="${fill}" ${chartMark(detail)}>${svgTitle(detail)}</rect>`;
      const bars = series.map((item, index) => {

        return `${rect(center - bar * 1.25, item.etfReturn, colors.baseline, detail)}${rect(center, item.alwaysStrategyReturn, "#18212f", detail)}${rect(center + bar * 1.25, item.timingStrategyReturn, colors.premium, detail)}`;

    }

    }

    function timingSignalScatter(id, series) {
      const el = byId(id);
      const valid = series.filter(item => num(item.row.entry_iv_rv20_spread) !== null && num(item.optionReturn) !== null);
      if (!el || !valid.length) { if (el) el.innerHTML = `<div class="empty">暂无可用的 IV-RV 与收益观测。</div>`; return; }
      const width = 660, height = 270, left = 47, right = 15, top = 16, bottom = 42;
      const xValues = valid.map(item => num(item.row.entry_iv_rv20_spread));
      const yValues = valid.map(item => item.optionReturn);
      const pearsonR = pearson(xValues, yValues);
      const spearmanRho = spearman(valid, item => num(item.row.entry_iv_rv20_spread), item => item.optionReturn);
      const xMin = Math.min(-.02, ...xValues), xMax = Math.max(.02, ...xValues), yMin = Math.min(-.02, ...yValues), yMax = Math.max(.02, ...yValues);
      const sx = value => scale(value, xMin, xMax, left, width - right), sy = value => scale(value, yMin, yMax, height - bottom, top);
      const dots = valid.map(item => {
        const detail = `开仓日：${item.row.rebalance_date}\n当前决策：${item.sell ? "卖出" : "不卖出"}\nIV 分位：${pct(item.ivPercentile, 0)}\nIV-RV：${pct(item.row.entry_iv_rv20_spread)}\n最终净期权收益：${pct(item.optionReturn)}\n判断：${item.reason}`;
        const fill = item.sell ? colors.premium : "#9eabb5";

      const bars = valid.map((row, index) => { const x = left + index * band + band / 2; const premium = num(row.gross_premium_cash); const net = num(row.net_option_pnl_cash); const rect = (value, dx, fill, label) => { const y = Math.min(zero, sy(value)); const detail = cycleDetail(row, label); return `<rect x="${x + dx - bar / 2}" y="${y}" width="${bar}" height="${Math.max(1, Math.abs(sy(value) - zero))}" fill="${fill}" ${chartMark(detail)}>${svgTitle(detail)}</rect>`; }; return `${rect(premium, -bar * 0.65, colors.premium, "收取权利金")}${rect(net, bar * 0.65, net >= 0 ? colors.net : colors.negative, "最终净期权收益")}`; }).join("");

    }

    function lineChart(id, records, xField, yField, options = {}) {
      const el = byId(id); const valid = records.filter(row => num(row[yField]) !== null && row[xField]); if (!valid.length) { el.innerHTML = `<div class="empty">不足12期滚动窗口。</div>`; return; }
      const width = 460, height = 280, left = 38, right = 10, top = 14, bottom = 44; const values = valid.map(row => num(row[yField])); let min = Math.min(...values), max = Math.max(...values); if (options.zero) { min = Math.min(min, 0); max = Math.max(max, 0); } const padding = (max - min || 0.01) * 0.1; min -= padding; max += padding; const sx = index => scale(index, 0, valid.length - 1, left, width - right); const sy = value => scale(value, min, max, height - bottom, top); const path = valid.map((row, index) => `${index ? "L" : "M"}${sx(index)},${sy(num(row[yField]))}`).join(" "); const zero = sy(0); const end = valid[valid.length - 1]; const points = valid.map((row, index) => { const detail = `${String(row[xField])}\n滚动12期净期权收益：${pct(row[yField])}`; return `<circle cx="${sx(index)}" cy="${sy(num(row[yField]))}" r="6" fill="transparent" ${chartMark(detail)}>${svgTitle(detail)}</circle>`; }).join("");

    function premiumScatter(id, records) {

      const width = 660, height = 270, left = 46, right = 14, top = 16, bottom = 42; const xVals = valid.map(row => num(row.gross_premium_cash)); const yVals = valid.map(row => num(row.net_option_pnl_cash)); const xMin = Math.min(0, ...xVals), xMax = Math.max(0, ...xVals); const yMin = Math.min(0, ...yVals), yMax = Math.max(0, ...yVals); const sx = value => scale(value, xMin, xMax, left, width - right); const sy = value => scale(value, yMin, yMax, height - bottom, top);

    }

    function netOptionHistogram(id, records) {
      const el = byId(id); const valid = records.filter(row => num(row.net_option_yield) !== null); if (!valid.length) { el.innerHTML = `<div class="empty">暂无收益分布数据。</div>`; return; }
      const values = valid.map(row => num(row.net_option_yield)); let min = Math.min(...values), max = Math.max(...values); if (min === max) { min -= 0.01; max += 0.01; } const binCount = Math.min(9, Math.max(6, Math.ceil(Math.sqrt(values.length)))); const step = (max - min) / binCount; const bins = Array.from({ length: binCount }, (_, index) => ({ start: min + index * step, end: min + (index + 1) * step, count: 0 }));
      values.forEach(value => { const index = Math.min(binCount - 1, Math.floor((value - min) / step)); bins[index].count += 1; });
      const width = 660, height = 270, left = 44, right = 12, top = 14, bottom = 42; const maxCount = Math.max(...bins.map(bin => bin.count), 1); const sy = value => scale(value, 0, maxCount, height - bottom, top); const band = (width - left - right) / binCount; const zeroX = 0 >= min && 0 <= max ? scale(0, min, max, left, width - right) : null;
      const bars = bins.map((bin, index) => { const x = left + index * band + band * 0.12; const y = sy(bin.count); const center = (bin.start + bin.end) / 2; const fill = center >= 0 ? colors.net : colors.negative; const detail = `单期净期权收益分布\n区间：${pct(bin.start)} 至 ${pct(bin.end)}\n周期数：${bin.count}\n样本占比：${pct(bin.count / valid.length)}`; return `<rect x="${x}" y="${y}" width="${band * 0.76}" height="${Math.max(1, height - bottom - y)}" fill="${fill}" ${chartMark(detail)}>${svgTitle(detail)}</rect>`; }).join("");
      el.innerHTML = `<svg viewBox="0 0 ${width} ${height}" role="img" aria-label="单期净期权收益率的频数分布"><line x1="${left}" x2="${width - right}" y1="${height - bottom}" y2="${height - bottom}" stroke="#9eabb5"/>${zeroX === null ? "" : `<line x1="${zeroX}" x2="${zeroX}" y1="${top}" y2="${height - bottom}" stroke="#9eabb5"/>`}${bars}<text x="4" y="${top + 4}" font-size="10" fill="#5e6a79">${maxCount}</text><text x="${left}" y="${height - 13}" font-size="10" fill="#5e6a79">${pct(min)}</text><text x="${width - right}" y="${height - 13}" text-anchor="end" font-size="10" fill="#5e6a79">${pct(max)}</text><text x="${left + (width - left - right) / 2}" y="${height - 4}" text-anchor="middle" font-size="10" fill="#5e6a79">单期净期权收益率</text></svg><div class="legend"><span><i style="background:${colors.net}"></i>正收益区间</span><span><i style="background:${colors.negative}"></i>负收益区间</span></div>`;

      const width = 860, height = 290, left = 50, right = 15, top = 16, bottom = 42; const xVals = valid.map(row => num(row.etf_period_return)); const yVals = valid.map(row => num(row.relative_to_buyhold_return)); const xMin = Math.min(-0.02, ...xVals), xMax = Math.max(0.02, ...xVals), yMin = Math.min(-0.02, ...yVals), yMax = Math.max(0.02, ...yVals); const sx = value => scale(value, xMin, xMax, left, width - right); const sy = value => scale(value, yMin, yMax, height - bottom, top); const dots = valid.map(row => { const x = sx(num(row.etf_period_return)), y = sy(num(row.relative_to_buyhold_return)), assigned = Boolean(row.assignment_flag); const fill = num(row.relative_to_buyhold_return) >= 0 ? colors.net : colors.negative; const detail = cycleDetail(row, "ETF 涨跌与相对裸持贡献"); const mark = chartMark(detail); return assigned ? `<rect x="${x - 3.5}" y="${y - 3.5}" width="7" height="7" fill="${fill}" ${mark}>${svgTitle(detail)}</rect>` : `<circle cx="${x}" cy="${y}" r="3.8" fill="${fill}" ${mark}>${svgTitle(detail)}</circle>`; }).join("");
      el.innerHTML = `<svg viewBox="0 0 ${width} ${height}" role="img" aria-label="ETF当期收益与备兑相对裸持贡献"><line x1="${sx(0)}" x2="${sx(0)}" y1="${top}" y2="${height - bottom}" stroke="#9eabb5"/><line x1="${left}" x2="${width - right}" y1="${sy(0)}" y2="${sy(0)}" stroke="#9eabb5"/>${dots}<text x="${left}" y="${height - 13}" font-size="10" fill="#5e6a79">${pct(xMin)}</text><text x="${width - right}" y="${height - 13}" text-anchor="end" font-size="10" fill="#5e6a79">${pct(xMax)}</text><text x="${left + (width - left - right) / 2}" y="${height - 4}" text-anchor="middle" font-size="10" fill="#5e6a79">ETF 当期收益</text><text x="5" y="${top + 4}" font-size="10" fill="#5e6a79">${pct(yMax)}</text><text x="5" y="${height - bottom}" font-size="10" fill="#5e6a79">${pct(yMin)}</text></svg><div class="legend"><span><i style="background:${colors.net}"></i>相对裸持增加收益</span><span><i style="background:${colors.negative}"></i>相对裸持减少收益</span><span>方形 = 行权，圆形 = 未行权</span></div>`;

      const width = 680, height = 260, left = 54, right = 18, top = 14, bottom = 50; const values = valid.map(row => num(row.net_option_yield_mean)); const min = Math.min(0, ...values), max = Math.max(0, ...values); const sy = value => scale(value, min, max, height - bottom, top); const zero = sy(0); const band = (width - left - right) / valid.length; const bars = valid.map((row, index) => { const value = num(row.net_option_yield_mean); const x = left + index * band + band * 0.22; const y = Math.min(zero, sy(value)); const detail = `市场情景：${row.market_regime}\n周期数：${fmt(row.cycle_count, 0)}\n平均净期权收益：${pct(row.net_option_yield_mean)}\n跑输裸持比例：${pct(row.underperform_buyhold_cycle_rate)}`; return `<rect x="${x}" y="${y}" width="${band * 0.56}" height="${Math.max(1, Math.abs(sy(value) - zero))}" fill="${value >= 0 ? colors.net : colors.negative}" ${chartMark(detail)}>${svgTitle(detail)}</rect><text x="${x + band * 0.28}" y="${height - 15}" text-anchor="middle" font-size="10" fill="#5e6a79">${esc(row.market_regime.replace("周期", ""))}</text>`; }).join("");

    // The client-facing total is the ETF result plus the fully settled option leg.
    function strategyNetRate(row) {
      return row.strategy_net_return ?? row.covered_call_period_return;
    }

    function strategyNetCash(row) {
      return row.strategy_net_pnl_cash ?? row.covered_call_pnl_cash;
    }

    function openingIntrinsicYield(row) {
      const spot = num(row.underlying_price_at_entry), strike = num(row.strike);
      if (spot === null || spot <= 0 || strike === null) return 0;
      return Math.max(spot - strike, 0) / spot;
    }

    function openingIntrinsicCash(row) {
      return openingIntrinsicYield(row) * (num(row.fixed_notional) || 100);
    }

    function optionTimeValueYield(row) {
      return (num(row.gross_premium_yield) || 0) - openingIntrinsicYield(row);
    }

    function optionTimeValueCash(row) {
      return (num(row.gross_premium_cash) || 0) - openingIntrinsicCash(row);
    }

    function lossRateAndCash(rate, amount) {
      return `${pct(-(num(rate) || 0))} / ${cash(amount)}`;
    }

        `行权/平仓扣减：${cash(row.exercise_or_close_cost_cash)}（${pct(-(num(row.exercise_or_close_cost_yield) || 0))}）`,
        `交易成本：${cash(row.transaction_cost_cash)}（${pct(-(num(row.transaction_cost_yield) || 0))}）`,
        `净期权收益：${cash(row.net_option_pnl_cash)}（${pct(row.net_option_yield)}）`,

        `到期前最近有效 IV：${pct(row.pre_settlement_iv)}（${row.pre_settlement_iv_date || "--"}）`,
        `持有期实现 RV：${pct(row.holding_realized_vol)}`,
        `事后 VRP（IV² - 实现方差，仅事后诊断）：${variancePoints(row.ex_post_variance_risk_premium)}`,
        `行权状态：${row.assignment_flag ? "行权" : "未行权"}`
      ].join("\n");
    }

    function groupedBars(id, records) {
      const el = byId(id);
      const series = records.map((row, index) => ({ row, index })).filter(item => num(item.row.gross_premium_yield) !== null);
      if (!series.length) { el.innerHTML = `<div class="empty">暂无现金流数据。</div>`; return; }
      const width = 860, height = 280, left = 44, right = 12, top = 14, bottom = 46;
      const values = series.flatMap(({ row }) => [num(row.gross_premium_yield) || 0, -(num(row.exercise_or_close_cost_yield) || 0)]);
      const max = Math.max(0, ...values), min = Math.min(0, ...values);
      const sy = value => scale(value, min, max, height - bottom, top);
      const zero = sy(0), band = (width - left - right) / series.length, bar = Math.max(3, Math.min(12, band * 0.30));
      const selected = selectedCycleIndex(records);
      const selectedItem = series.find(item => item.index === selected);
      const selectedBand = selectedItem ? `<rect x="${left + series.indexOf(selectedItem) * band}" y="${top}" width="${band}" height="${height - top - bottom}" fill="#dcecf5" pointer-events="none"></rect>` : "";
      const bars = series.map(({ row, index: sourceIndex }, index) => {
        const x = left + index * band + band / 2;
        const premium = num(row.gross_premium_yield) || 0;
        const deduction = -(num(row.exercise_or_close_cost_yield) || 0);
        const detail = cycleDetail(row, "每期权利金与上涨截断");
        const rect = (value, dx, fill) => {
          const y = Math.min(zero, sy(value));
          return `<rect x="${x + dx - bar / 2}" y="${y}" width="${bar}" height="${Math.max(1, Math.abs(sy(value) - zero))}" fill="${fill}" ${chartMark(detail)}>${svgTitle(detail)}</rect>`;
        };
        return `${rect(premium, -bar * 0.65, colors.premium)}${rect(deduction, bar * 0.65, colors.relative)}`;
      }).join("");
      const zones = series.map(({ index: sourceIndex }, index) => `<rect class="period-hit" data-cycle-index="${sourceIndex}" x="${left + index * band}" y="${top}" width="${band}" height="${height - top - bottom}" fill="transparent" style="cursor:pointer"></rect>`).join("");
      const ticks = [0, Math.floor(series.length / 2), series.length - 1].filter((value, index, arr) => arr.indexOf(value) === index).map(index => `<text x="${left + index * band + band / 2}" y="${height - 13}" text-anchor="middle" font-size="10" fill="#5e6a79">${esc(String(series[index].row.rebalance_date).slice(0, 7))}</text>`).join("");
      el.innerHTML = `<svg viewBox="0 0 ${width} ${height}" role="img" aria-label="每期权利金与上涨截断/平仓扣减"><line x1="${left}" x2="${width - right}" y1="${zero}" y2="${zero}" stroke="#9eabb5"/>${selectedBand}${bars}${zones}<text x="5" y="${top + 4}" font-size="10" fill="#5e6a79">${pct(max)}</text><text x="5" y="${height - bottom}" font-size="10" fill="#5e6a79">${pct(min)}</text>${ticks}</svg><div class="legend"><span><i style="background:${colors.premium}"></i>收取权利金</span><span><i style="background:${colors.relative}"></i>上涨截断/平仓扣减</span><span>明细同时显示收益率 / 每 100 名义本金金额</span></div>`;
      bindCycleBarEvents(el, records);
    }

    function groupedBars(id, records) {
      const el = byId(id);
      const series = records.map((row, index) => ({ row, index })).filter(item => num(item.row.gross_premium_yield) !== null);
      if (!series.length) { el.innerHTML = `<div class="empty">暂无现金流数据。</div>`; return; }

      const width = 860, height = 280, left = 44, right = 52, top = 14, bottom = 46;
      const values = series.flatMap(({ row }) => [num(row.gross_premium_yield) || 0, -(num(row.exercise_or_close_cost_yield) || 0)]);
      const max = Math.max(0, ...values), min = Math.min(0, ...values);
      const sy = value => scale(value, min, max, height - bottom, top);
      const zero = sy(0), band = (width - left - right) / series.length, bar = Math.max(3, Math.min(12, band * 0.30));

      const ivRvValues = series.map(item => num(item.row.entry_iv_rv20_spread)).filter(value => value !== null);
      const hasIvRv = ivRvValues.length > 0;
      let ivRvMin = hasIvRv ? Math.min(0, ...ivRvValues) : 0;
      let ivRvMax = hasIvRv ? Math.max(0, ...ivRvValues) : 0.01;
      const ivRvPad = Math.max((ivRvMax - ivRvMin) * 0.12, 0.005);
      ivRvMin -= ivRvPad;
      ivRvMax += ivRvPad;
      const syIvRv = value => scale(value, ivRvMin, ivRvMax, height - bottom, top);

      const selected = selectedCycleIndex(records);
      const selectedItem = series.find(item => item.index === selected);
      const selectedBand = selectedItem ? `<rect x="${left + series.indexOf(selectedItem) * band}" y="${top}" width="${band}" height="${height - top - bottom}" fill="#dcecf5" pointer-events="none"></rect>` : "";
      const bars = series.map(({ row }, index) => {
        const x = left + index * band + band / 2;
        const premium = num(row.gross_premium_yield) || 0;
        const deduction = -(num(row.exercise_or_close_cost_yield) || 0);
        const detail = cycleDetail(row, "每期权利金、上涨截断与开仓 IV-RV");
        const rect = (value, dx, fill) => {
          const y = Math.min(zero, sy(value));
          return `<rect x="${x + dx - bar / 2}" y="${y}" width="${bar}" height="${Math.max(1, Math.abs(sy(value) - zero))}" fill="${fill}" ${chartMark(detail)}>${svgTitle(detail)}</rect>`;
        };
        return `${rect(premium, -bar * 0.65, colors.premium)}${rect(deduction, bar * 0.65, colors.relative)}`;
      }).join("");

      let ivRvStarted = false;
      const ivRvPath = series.map(({ row }, index) => {
        const value = num(row.entry_iv_rv20_spread);
        if (value === null) { ivRvStarted = false; return ""; }
        const x = left + index * band + band / 2;
        const command = ivRvStarted ? "L" : "M";
        ivRvStarted = true;
        return `${command}${x},${syIvRv(value)}`;
      }).join(" ");
      const ivRvMarks = hasIvRv ? series.map(({ row }, index) => {
        const value = num(row.entry_iv_rv20_spread);
        if (value === null) return "";
        const x = left + index * band + band / 2;
        return `<circle cx="${x}" cy="${syIvRv(value)}" r="2.5" fill="${colors.baseline}" pointer-events="none"></circle>`;
      }).join("") : "";
      const ivRvLine = hasIvRv ? `<path d="${ivRvPath}" fill="none" stroke="${colors.baseline}" stroke-width="2" pointer-events="none"></path>${ivRvMarks}` : "";

      const zones = series.map(({ index: sourceIndex }, index) => `<rect class="period-hit" data-cycle-index="${sourceIndex}" x="${left + index * band}" y="${top}" width="${band}" height="${height - top - bottom}" fill="transparent" style="cursor:pointer"></rect>`).join("");
      const ticks = [0, Math.floor(series.length / 2), series.length - 1].filter((value, index, arr) => arr.indexOf(value) === index).map(index => `<text x="${left + index * band + band / 2}" y="${height - 13}" text-anchor="middle" font-size="10" fill="#5e6a79">${esc(String(series[index].row.rebalance_date).slice(0, 7))}</text>`).join("");
      const ivRvAxis = hasIvRv ? `<text x="${width - 3}" y="${top + 4}" text-anchor="end" font-size="10" fill="#5e6a79">${pct(ivRvMax)}</text><text x="${width - 3}" y="${height - bottom}" text-anchor="end" font-size="10" fill="#5e6a79">${pct(ivRvMin)}</text>` : "";
      const signalLegend = hasIvRv ? `<span><i style="background:${colors.baseline}"></i>开仓日 IV - 开仓前20日 RV（右轴）</span><span>RV 已滞后一日；IV 取开仓日快照，择时前需与实际下单时点对齐。</span>` : "";

      el.innerHTML = `<svg viewBox="0 0 ${width} ${height}" role="img" aria-label="每期权利金、上涨截断/平仓扣减与开仓 IV-RV"><line x1="${left}" x2="${width - right}" y1="${zero}" y2="${zero}" stroke="#9eabb5"/>${selectedBand}${bars}${ivRvLine}${zones}<text x="5" y="${top + 4}" font-size="10" fill="#5e6a79">${pct(max)}</text><text x="5" y="${height - bottom}" font-size="10" fill="#5e6a79">${pct(min)}</text>${ivRvAxis}${ticks}</svg><div class="legend"><span><i style="background:${colors.premium}"></i>收取权利金</span><span><i style="background:${colors.relative}"></i>上涨截断/平仓扣减</span>${signalLegend}</div>`;
      bindCycleBarEvents(el, records);
    }

    function cycleKey(row, index) {
      return row.cycle_id || [row.strategy_name || "", row.rebalance_date || "", row.period_end_date || "", index].join("__");
    }

    function syncSelectedCycles(records) {
      const known = new Set(records.map((row, index) => cycleKey(row, index)));
      if (!Array.isArray(state.selectedCycleIds)) {
        const lastIndex = records.length - 1;
        state.selectedCycleIds = lastIndex >= 0 ? [cycleKey(records[lastIndex], lastIndex)] : [];
        state.activeCycleId = state.selectedCycleIds[0] || null;
        return;
      }
      state.selectedCycleIds = state.selectedCycleIds.filter(key => known.has(key));
      if (!state.activeCycleId || !state.selectedCycleIds.includes(state.activeCycleId)) {
        state.activeCycleId = state.selectedCycleIds[state.selectedCycleIds.length - 1] || null;
      }
    }

    function selectedCycleLedger(records) {
      const selected = new Set(state.selectedCycleIds || []);
      return records.filter((row, index) => selected.has(cycleKey(row, index)));
    }

    function activeSelectedCycle(records) {
      const active = state.activeCycleId;
      return records.find((row, index) => cycleKey(row, index) === active) || null;
    }

    function toggleLedgerCycleSelection(records, index) {
      const row = records[index];
      if (!row) return;
      const key = cycleKey(row, index);
      const next = new Set(state.selectedCycleIds || []);
      if (next.has(key)) {
        next.delete(key);
        if (state.activeCycleId === key) state.activeCycleId = [...next].at(-1) || null;
      } else {
        next.add(key);
        state.activeCycleId = key;
      }
      state.selectedCycleIds = [...next];
      renderKpis();
      renderCycles(true);
    }

    function renderCycleChecklist(records) {
      const root = byId("cycleChecklist");
      if (!root) return;
      const selected = new Set(state.selectedCycleIds || []);
      root.innerHTML = records.length ? records.map((row, index) => {
        const key = cycleKey(row, index);
        const checked = selected.has(key);
        const strategy = strategyNetRate(row);
        return `<label class="cycle-check"><input type="checkbox" data-cycle-select="${esc(key)}"${checked ? " checked" : ""}><span><strong>${esc(row.rebalance_date || "--")} 至 ${esc(row.period_end_date || "--")}</strong><span>ETF ${pct(row.etf_period_return)} | 净期权 ${pct(row.net_option_yield)} | 策略 ${pct(strategy)}${row.assignment_flag ? " | 已行权" : ""}</span></span></label>`;
      }).join("") : `<div class="empty">暂无交易周期。</div>`;

      root.querySelectorAll("[data-cycle-select]").forEach(input => input.addEventListener("change", event => {
        const next = new Set(state.selectedCycleIds || []);
        if (event.target.checked) {
          next.add(event.target.dataset.cycleSelect);
          state.activeCycleId = event.target.dataset.cycleSelect;
        } else {
          next.delete(event.target.dataset.cycleSelect);
          if (state.activeCycleId === event.target.dataset.cycleSelect) state.activeCycleId = [...next].at(-1) || null;
        }
        state.selectedCycleIds = [...next];
        renderKpis();
        renderCycles(true);
      }));
      const selectAll = byId("selectAllCycles");
      if (selectAll) selectAll.addEventListener("click", () => {
        state.selectedCycleIds = records.map((row, index) => cycleKey(row, index));
        state.activeCycleId = state.selectedCycleIds[state.selectedCycleIds.length - 1] || null;
        renderKpis();
        renderCycles(true);
      });
      const clear = byId("clearSelectedCycles");
      if (clear) clear.addEventListener("click", () => {
        state.selectedCycleIds = [];
        state.activeCycleId = null;
        renderKpis();
        renderCycles(true);
      });
    }

    function selectedCycleStatistics(records) {
      const total = field => records.reduce((sum, row) => sum + (num(row[field]) || 0), 0);
      const strategyTotal = records.reduce((sum, row) => sum + (strategyNetCash(row) || 0), 0);
      const relativeTotal = total("relative_to_buyhold_pnl_cash");
      const assigned = records.filter(row => Boolean(row.assignment_flag)).length;
      const positiveStrategy = records.filter(row => (strategyNetRate(row) || 0) > 0).length;
      return {
        count: records.length,
        etfCash: total("etf_pnl_cash"),
        grossPremiumCash: total("gross_premium_cash"),
        openingIntrinsicCash: records.reduce((sum, row) => sum + openingIntrinsicCash(row), 0),
        optionTimeValueCash: records.reduce((sum, row) => sum + optionTimeValueCash(row), 0),
        transactionCostCash: total("transaction_cost_cash"),
        exerciseOrCloseCostCash: total("exercise_or_close_cost_cash"),
        netOptionCash: total("net_option_pnl_cash"),
        strategyCash: strategyTotal,
        relativeCash: relativeTotal,
        assigned,
        positiveStrategy
      };
    }

    function selectedCyclesSummary(records) {
      if (!records.length) return `<div class="empty">请从左侧选择至少一个交易周期，右侧将展示这些周期的收益构成与汇总。</div>`;
      const stats = selectedCycleStatistics(records);
      const metrics = [
        ["已选周期", `${fmt(stats.count, 0)} 期`],
        ["ETF 当期收益累计", cash(stats.etfCash)],
        ["净期权收益累计", cash(stats.netOptionCash)],
        ["策略当期收益累计", cash(stats.strategyCash)],
        ["相对裸持累计差额", cash(stats.relativeCash)],
        ["发生行权 / 策略为正", `${fmt(stats.assigned, 0)} / ${fmt(stats.positiveStrategy, 0)}`]
      ];
      const components = [
        ["ETF 当期收益", cash(stats.etfCash)],
        ["总权利金（含内在价值）", cash(stats.grossPremiumCash)],
        ["开仓内在价值", cash(stats.openingIntrinsicCash)],
        ["开仓时间价值", cash(stats.optionTimeValueCash)],
        ["行权/平仓扣减", cash(stats.exerciseOrCloseCostCash)],
        ["交易成本", cash(stats.transactionCostCash)],
        ["最终净期权收益", cash(stats.netOptionCash)],
        ["完整策略当期收益", cash(stats.strategyCash)]
      ];
      return `<div class="selection-metrics">${metrics.map(([label, value]) => `<div><span>${esc(label)}</span><strong>${esc(value)}</strong></div>`).join("")}</div><div class="table-wrap"><table><thead><tr>${components.map(([label]) => `<th>${esc(label)}</th>`).join("")}</tr></thead><tbody><tr>${components.map(([, value]) => `<td>${esc(value)}</td>`).join("")}</tr></tbody></table></div>`;
    }

    function selectedCyclesChart(records) {
      const el = byId("selectedCyclesChart");
      if (!el) return;
      if (!records.length) {
        el.innerHTML = `<div class="empty">选择交易周期后显示收益构成。</div>`;
        return;
      }
      const width = 980, height = 300, left = 46, right = 16, top = 16, bottom = 46;
      const values = records.flatMap(row => [num(row.etf_period_return) || 0, netPremiumYield(row), num(row.net_option_yield) || 0, strategyNetRate(row) || 0]);
      const { min, max } = chartDomain(values);
      const sy = value => scale(value, min, max, height - bottom, top);
      const zero = sy(0), band = (width - left - right) / records.length, bar = Math.max(3, Math.min(13, band * 0.20));
      const rect = (x, value, fill, detail) => {
        const y = Math.min(zero, sy(value));
        return `<rect x="${x - bar / 2}" y="${y}" width="${bar}" height="${Math.max(1, Math.abs(sy(value) - zero))}" fill="${fill}" ${chartMark(detail)}>${svgTitle(detail)}</rect>`;
      };
      const marks = records.map((row, index) => {
        const center = left + index * band + band / 2;
        const detail = cycleDetail(row, "所选交易周期收益构成");
        return `${rect(center - bar * 1.8, num(row.etf_period_return) || 0, colors.baseline, detail)}${rect(center - bar * 0.6, netPremiumYield(row), colors.premium, detail)}${rect(center + bar * 0.6, num(row.net_option_yield) || 0, colors.net, detail)}${rect(center + bar * 1.8, strategyNetRate(row) || 0, "#18212f", detail)}`;
      }).join("");
      const tickIndices = [0, Math.floor((records.length - 1) / 2), records.length - 1].filter((value, index, items) => items.indexOf(value) === index);
      const ticks = tickIndices.map(index => `<text x="${left + index * band + band / 2}" y="${height - 13}" text-anchor="middle" font-size="10" fill="#5e6a79">${esc(String(records[index].rebalance_date).slice(0, 10))}</text>`).join("");
      el.innerHTML = `<svg viewBox="0 0 ${width} ${height}" role="img" aria-label="所选交易周期的ETF收益、权利金净收入、净期权收益和完整策略收益"><line x1="${left}" x2="${width - right}" y1="${zero}" y2="${zero}" stroke="#9eabb5"/>${marks}<text x="5" y="${top + 4}" font-size="10" fill="#5e6a79">${pct(max)}</text><text x="5" y="${height - bottom}" font-size="10" fill="#5e6a79">${pct(min)}</text>${ticks}</svg><div class="legend"><span><i style="background:${colors.baseline}"></i>ETF 当期收益</span><span><i style="background:${colors.premium}"></i>权利金净收入（扣摩擦，不含截断）</span><span><i style="background:${colors.net}"></i>最终净期权收益</span><span><i style="background:#18212f"></i>完整策略当期收益</span></div>`;
    }

    function renderSelectedCyclesAnalysis(records) {
      const summary = byId("selectedCycleSummary");
      const table = byId("selectedCyclesTable");
      if (summary) summary.innerHTML = selectedCyclesSummary(records);
      selectedCyclesChart(records);
      if (table) table.innerHTML = ledgerTable(records);
    }

    function includedCycleLedger(records) {
      const excluded = new Set(state.excludedCycleIds || []);
      return records.filter((row, index) => !excluded.has(cycleKey(row, index)));
    }

    function median(values) {
      const valid = values.map(num).filter(value => value !== null).sort((a, b) => a - b);
      if (!valid.length) return null;
      const middle = Math.floor(valid.length / 2);
      return valid.length % 2 ? valid[middle] : (valid[middle - 1] + valid[middle]) / 2;
    }

    function cycleStatistics(records) {
      const total = field => records.reduce((sum, row) => sum + (num(row[field]) || 0), 0);
      const strategyCash = row => num(row.strategy_net_pnl_cash ?? row.covered_call_pnl_cash) || 0;
      const selected = records.filter(row => (num(row.selected_option_flag) || 0) === 1);
      const netOption = records.map(row => num(row.net_option_yield)).filter(value => value !== null);
      return {
        cycle_count: records.length,
        gross_premium_cash_total: total("gross_premium_cash"),
        transaction_cost_cash_total: total("transaction_cost_cash"),
        premium_income_cash_total: total("gross_premium_cash") + total("transaction_cost_cash"),
        exercise_or_close_cost_cash_total: total("exercise_or_close_cost_cash"),
        etf_pnl_cash_total: total("etf_pnl_cash"),
        net_option_pnl_cash_total: total("net_option_pnl_cash"),
        strategy_net_pnl_cash_total: records.reduce((sum, row) => sum + strategyCash(row), 0),
        net_option_yield_median: median(netOption),
        positive_net_option_cycle_rate: netOption.length ? netOption.filter(value => value > 0).length / netOption.length : null,
        selected_option_cycle_count: selected.length,
        assignment_count: selected.filter(row => Boolean(row.assignment_flag)).length,
        assignment_rate: selected.length ? selected.filter(row => Boolean(row.assignment_flag)).length / selected.length : null
      };
    }

    function exclusionSummaryTable(allRecords, includedRecords) {
      const full = cycleStatistics(allRecords);
      const kept = cycleStatistics(includedRecords);
      const removed = Math.max(full.cycle_count - kept.cycle_count, 0);
      const rows = [
        ["保留 / 剔除周期", `${fmt(full.cycle_count, 0)} / 0`, `${fmt(kept.cycle_count, 0)} / ${fmt(removed, 0)}`],
        ["收取权利金累计", cash(full.gross_premium_cash_total), cash(kept.gross_premium_cash_total)],
        ["净期权收益累计", cash(full.net_option_pnl_cash_total), cash(kept.net_option_pnl_cash_total)],
        ["策略当期净收益累计", cash(full.strategy_net_pnl_cash_total), cash(kept.strategy_net_pnl_cash_total)],
        ["单期净期权收益中位数", pct(full.net_option_yield_median), pct(kept.net_option_yield_median)],
        ["期权腿为正比例", pct(full.positive_net_option_cycle_rate), pct(kept.positive_net_option_cycle_rate)],
        ["行权比例", pct(full.assignment_rate), pct(kept.assignment_rate)]
      ];
      return `<div class="table-wrap"><table><thead><tr><th class="left">统计口径</th><th>全样本</th><th>剔除后</th></tr></thead><tbody>${rows.map(row => `<tr><td class="left">${esc(row[0])}</td><td>${esc(row[1])}</td><td>${esc(row[2])}</td></tr>`).join("")}</tbody></table></div>`;
    }

    function renderExclusionControls(records) {
      const select = byId("excludedCycleSelect");
      const summary = byId("exclusionSummary");
      if (!select || !summary) return;
      const knownKeys = new Set(records.map((row, index) => cycleKey(row, index)));
      state.excludedCycleIds = (state.excludedCycleIds || []).filter(key => knownKeys.has(key));
      const selected = new Set(state.excludedCycleIds);
      select.innerHTML = records.map((row, index) => {
        const key = cycleKey(row, index);

    function parseCsvRecords(text) {
      const table = [], row = [];
      let cell = "", quoted = false;
      const pushCell = () => { row.push(cell); cell = ""; };
      const pushRow = () => { pushCell(); if (row.length > 1 || row[0] !== "") table.push(row.splice(0)); };
      for (let index = 0; index < text.length; index += 1) {
        const char = text[index];
        if (char === '"') {
          if (quoted && text[index + 1] === '"') { cell += '"'; index += 1; }
          else quoted = !quoted;
        } else if (char === "," && !quoted) pushCell();
        else if ((char === "\n" || char === "\r") && !quoted) {
          if (char === "\r" && text[index + 1] === "\n") index += 1;
          pushRow();
        } else cell += char;
      }
      if (cell.length || row.length) pushRow();
      const [header = [], ...body] = table;
      return body.map(values => Object.fromEntries(header.map((key, index) => [key, values[index] ?? ""])));
    }

    function earlyCloseDailyUrl() {
      return state.earlyclose.rule === "tp80"
        ? "../../outputs/ver4_2_tp80_buyback/ver4_2_tp80_buyback_cycle_daily_mtm.csv?v=early-path-20260716"
        : "../../outputs/ver4_1_delta_buyback/ver4_1_delta_buyback_cycle_daily_mtm.csv?v=early-path-20260716";
    }

    function ensureEarlyCloseDailyData() {
      const rule = state.earlyclose.rule;
      if (earlyCloseDailyCache[rule]) return Promise.resolve(earlyCloseDailyCache[rule]);
      if (earlyCloseDailyRequests[rule]) return earlyCloseDailyRequests[rule];
      earlyCloseDailyRequests[rule] = fetch(earlyCloseDailyUrl())
        .then(response => {
          if (!response.ok) throw new Error(`日频路径文件读取失败：${response.status}`);
          return response.text();
        })
        .then(text => {
          earlyCloseDailyCache[rule] = parseCsvRecords(text);
          return earlyCloseDailyCache[rule];
        })
        .finally(() => { delete earlyCloseDailyRequests[rule]; });
      return earlyCloseDailyRequests[rule];
    }

    function earlyCloseDailyRecords(cycleId) {
      const parameter = Number(state.earlyclose.threshold);
      return rows(earlyCloseDailyCache[state.earlyclose.rule]).filter(row =>

        && row.strategy_name === state.strategy
        && row.cycle_id === cycleId
        && Math.abs((num(row.early_close_parameter) ?? -1) - parameter) < 1e-8

    function syncEarlyCloseCycles(records) {
      const available = records.map(row => row.cycle_id).filter(Boolean);
      const known = new Set(available);
      if (!Array.isArray(state.earlyclose.selectedCycleIds)) {
        const preferred = records.filter(row => truthyFlag(row.buyback_triggered)).at(-1)?.cycle_id || available.at(-1) || null;
        state.earlyclose.selectedCycleIds = preferred ? [preferred] : [];
        state.earlyclose.activeCycleId = preferred;
        return;
      }
      state.earlyclose.selectedCycleIds = state.earlyclose.selectedCycleIds.filter(id => known.has(id));
      if (!state.earlyclose.activeCycleId || !state.earlyclose.selectedCycleIds.includes(state.earlyclose.activeCycleId)) {
        state.earlyclose.activeCycleId = state.earlyclose.selectedCycleIds.at(-1) || null;
      }
    }

    function selectedEarlyCloseCycles(records) {
      const selected = new Set(state.earlyclose.selectedCycleIds || []);
      return records.filter(row => selected.has(row.cycle_id));

      }).join("") || `<div class="empty">暂无可诊断周期。</div>`;
      root.querySelectorAll("[data-earlyclose-cycle]").forEach(input => input.addEventListener("change", event => {

    function earlyClosePathTimeline(series, width, left, right) {
      const timestamps = series.map(row => Date.parse(`${row.date}T00:00:00`));
      const first = timestamps[0], last = timestamps.at(-1);
      const sx = index => first === last ? left + (width - left - right) / 2 : scale(timestamps[index], first, last, left, width - right);
      const triggerIndex = series.findIndex(row => truthyFlag(row.buyback_trigger_day));
      const tickIndices = [0, Math.round((series.length - 1) / 3), Math.round((series.length - 1) * 2 / 3), series.length - 1, triggerIndex]
        .filter(index => index >= 0)
        .filter((index, position, items) => items.indexOf(index) === position)
        .sort((a, b) => a - b);
      const calendarDays = Math.round((last - first) / 86400000) + 1;
      return { sx, triggerIndex, tickIndices, calendarDays };
    }

    function deltaTriggerPathItems(records) {
      if (state.earlyclose.rule !== "delta" || !earlyCloseDailyCache.delta) return [];
      return records.filter(row => truthyFlag(row.buyback_triggered)).map(row => {
        const series = earlyCloseDailyRecords(row.cycle_id);
        const triggerIndex = series.findIndex(item => truthyFlag(item.buyback_trigger_day));
        if (triggerIndex < 0 || !series.length) return null;
        const trigger = series[triggerIndex], tail = series.slice(triggerIndex);
        const triggerPrice = num(trigger.underlying_price), endPrice = num(tail.at(-1)?.underlying_price);
        if (triggerPrice === null || triggerPrice <= 0 || endPrice === null) return null;
        const tailPrices = tail.map(item => num(item.underlying_price)).filter(value => value !== null && value > 0);
        if (!tailPrices.length) return null;
        const postReturn = endPrice / triggerPrice - 1;
        const postMaxReturn = Math.max(...tailPrices) / triggerPrice - 1;
        const postMinReturn = Math.min(...tailPrices) / triggerPrice - 1;
        const category = postReturn > 0
          ? "周期末仍高于买回日"
          : postMaxReturn > 0
            ? "期间继续上涨后回落"
            : "买回后未再上涨";
        return {
          row, trigger, postReturn, postMaxReturn, postMinReturn, category,
          strategyChange: num(row.delta_buyback_strategy_change) || 0,
          wouldAssign: truthyFlag(row.baseline_assignment_flag),
          observationDays: tail.length,
        };
      }).filter(Boolean);
    }

      const dots = items.map(item => {
        const fill = item.strategyChange >= 0 ? colors.net : colors.negative;
        const detail = deltaTriggerDetail(item);
        const mark = chartMark(detail);
        return item.wouldAssign
          ? `<rect x="${sx(item[field]) - 4}" y="${sy(item.strategyChange) - 4}" width="8" height="8" fill="${fill}" ${mark}>${svgTitle(detail)}</rect>`
